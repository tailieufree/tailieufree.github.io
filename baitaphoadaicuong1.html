<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>BÀI TẬP HÓA ĐẠI CƯƠNG 1 PDF</title>

  <meta property="og:title"

  <meta property="og:description"

  <meta property="og:type"
        content="website">

  <meta property="og:url"
        content="https://tailieufree.github.io/baitaphoadaicuong1.html">


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;
      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f5f5;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;

    }

    .container {

      width: 100%;
      max-width: 520px;

      background: white;

      padding: 28px;

      border-radius: 20px;

      text-align: center;

      box-shadow:
        0 5px 25px
        rgba(0, 0, 0, 0.12);

    }

    h1 {

      font-size: 25px;

      margin-top: 0;
      margin-bottom: 12px;

      color: #222;

    }

    .description {

      font-size: 15px;

      color: #666;

      line-height: 1.6;

      margin-bottom: 22px;

    }

    .download-box {

      width: 100%;

      padding: 38px 20px;

      background: #fff3e0;

      border:
        2px dashed
        #ff9800;

      border-radius: 16px;

      cursor: pointer;

      transition: 0.2s;

      user-select: none;

    }

    .download-box:hover {

      transform: translateY(-2px);

      box-shadow:
        0 5px 15px
        rgba(0,0,0,0.08);

    }

    .download-box:active {

      transform: scale(0.98);

    }

    .icon {

      font-size: 58px;

      margin-bottom: 12px;

    }

    .download-title {

      font-size: 19px;

      font-weight: bold;

      color: #333;

      line-height: 1.6;

    }

    .download-btn {

      margin-top: 18px;

      width: 100%;

      padding: 17px;

      border: none;

      border-radius: 12px;

      background: #ff5722;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;

    }

    .download-btn:hover {

      opacity: 0.92;

    }

    .download-btn:active {

      transform: scale(0.98);

    }

    .note {

      margin-top: 17px;

      font-size: 13px;

      color: #777;

      line-height: 1.6;

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📚 BÀI TẬP HÓA ĐẠI CƯƠNG 1
  </h1>


  <div class="description">

    Tài liệu PDF miễn phí.

    <br>

    Nhấn vào bên dưới để tải tài liệu.

  </div>


  <div
    class="download-box"
    onclick="handleDownload()"
  >

    <div class="icon">
      📖
    </div>

    <div class="download-title">

      NHẤN VÀO ĐỂ TẢI
      <br>
      BÀI TẬP HÓA ĐẠI CƯƠNG 1 PDF

    </div>

  </div>


  <button
    class="download-btn"
    onclick="handleDownload()"
  >

    📥 TẢI BÀI TẬP HÓA ĐẠI CƯƠNG 1 PDF

  </button>


  <div class="note">

    Nếu một trang mới được mở,
    hãy quay lại trang này
    và nhấn lại để tiếp tục tải tài liệu.

  </div>


</div>


<script>

  /*
    SHOPEE AFFILIATE
  */

  const shopeeLink =
    "https://s.shopee.vn/2VqpekcaTm";


  /*
    GOOGLE DRIVE
  */

  const driveLink =
    "https://drive.google.com/file/d/19OK-pw6vf4k_eM5SpMgBNq4EAczpyFge/view";


  /*
    CHU KỲ:

    1 → Shopee
    2 → Drive
    3 → Drive

    4 → Shopee
    5 → Drive
    6 → Drive

    → Lặp lại
  */


  function handleDownload() {


    let count =
      parseInt(
        localStorage.getItem(
          "baitaphoadaicuong1_click"
        )
      ) || 0;


    count++;


    localStorage.setItem(
      "baitaphoadaicuong1_click",
      count
    );


    const position =
      (count - 1) % 3;


    if (position === 0) {

      /*
        LẦN 1, 4, 7...
        → SHOPEE MỞ TAB MỚI
      */

      window.open(
        shopeeLink,
        "_blank"
      );

    }

    else {

      /*
        LẦN 2, 3, 5, 6...
        → GOOGLE DRIVE
      */

      window.location.href =
        driveLink;

    }

  }

</script>


</body>

</html>
