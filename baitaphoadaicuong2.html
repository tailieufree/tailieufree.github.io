<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">


  <!-- =========================
       PREVIEW KHI CHIA SẺ LINK
       ========================= -->

  <title>Bài tập Hóa Đại Cương 2 PDF</title>

  <meta name="description"
        content="Tải miễn phí tài liệu Bài tập Hóa Đại Cương 2 PDF tại đây.">


  <!-- Facebook / Messenger / Zalo -->

  <meta property="og:title"
        content="Bài tập Hóa Đại Cương 2 PDF">

  <meta property="og:description"
        content="Tải miễn phí tài liệu Bài tập Hóa Đại Cương 2 PDF tại đây.">

  <meta property="og:type"
        content="website">

  <meta property="og:url"
        content="https://tailieufree.github.io/baitaphoadaicuong2.html">


  <!-- =========================
       GIAO DIỆN
       ========================= -->

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f5f5f5;

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 100vh;

    }


    .container {

      width: 100%;

      max-width: 520px;

      background: white;

      padding: 28px;

      border-radius: 20px;

      text-align: center;

      box-shadow:
        0 5px 25px
        rgba(0, 0, 0, 0.12);

    }


    h1 {

      font-size: 25px;

      margin-top: 0;

      margin-bottom: 12px;

      color: #222;

    }


    .description {

      font-size: 15px;

      color: #666;

      line-height: 1.6;

      margin-bottom: 22px;

    }


    /*
       Ô lớn có thể bấm
    */

    .download-box {

      width: 100%;

      padding: 38px 20px;

      background: #fff3e0;

      border:
        2px dashed
        #ff9800;

      border-radius: 16px;

      cursor: pointer;

      transition: 0.2s;

      user-select: none;

    }


    .download-box:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 5px 15px
        rgba(0,0,0,0.08);

    }


    .download-box:active {

      transform:
        scale(0.98);

    }


    .icon {

      font-size: 58px;

      margin-bottom: 12px;

    }


    .download-title {

      font-size: 19px;

      font-weight: bold;

      color: #333;

      line-height: 1.5;

    }


    /*
       Nút tải phía dưới
    */

    .download-btn {

      margin-top: 18px;

      width: 100%;

      padding: 17px;

      border: none;

      border-radius: 12px;

      background: #ff5722;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;

    }


    .download-btn:hover {

      opacity: 0.92;

    }


    .download-btn:active {

      transform:
        scale(0.98);

    }


    .note {

      margin-top: 17px;

      font-size: 13px;

      color: #777;

      line-height: 1.6;

    }

  </style>

</head>



<body>


  <div class="container">


    <h1>
      📚 BÀI TẬP HÓA ĐẠI CƯƠNG 2
    </h1>


    <div class="description">

      Tài liệu PDF miễn phí.

      <br>

      Bấm vào ô hoặc nút bên dưới
      để lấy tài liệu.

    </div>



    <!-- Ô lớn -->

    <div
      class="download-box"
      onclick="handleDownload()"
    >

      <div class="icon">
        📖
      </div>


      <div class="download-title">

        BẤM VÀO ĐÂY
        <br>
        ĐỂ LẤY TÀI LIỆU

      </div>

    </div>



    <!-- Nút tải -->

    <button
      class="download-btn"
      onclick="handleDownload()"
    >

      📥 TẢI TÀI LIỆU MIỄN PHÍ

    </button>



    <div class="note">

      Nếu một trang mới được mở,
      hãy quay lại trang này
      và bấm lại để tiếp tục tải tài liệu.

    </div>


  </div>



  <!-- =========================
       XỬ LÝ LINK
       ========================= -->

  <script>


    /*
      LINK SHOPEE AFFILIATE
    */

    const shopeeLink =
      "https://s.shopee.vn/2VqpekcaTm";


    /*
      LINK GOOGLE DRIVE
    */

    const driveLink =
      "https://drive.google.com/file/d/1AYmjFOo8pbSOaEmrJ3z2iylxIok-u7Fw/view?usp=sharing";


    /*
      CHU KỲ CLICK

      Lần 1 → Shopee

      Lần 2 → Drive

      Lần 3 → Drive


      Lần 4 → Shopee

      Lần 5 → Drive

      Lần 6 → Drive


      Lần 7 → Shopee

      ...

      Cứ 3 lần lặp lại.
    */


    function handleDownload() {


      /*
        Lấy số lần click đã lưu
      */

      let count =
        parseInt(
          localStorage.getItem(
            "baitaphoadaicuong2_click"
          )
        ) || 0;



      /*
        Tăng thêm 1 click
      */

      count++;



      /*
        Lưu lại trên trình duyệt

        F5 / đóng mở lại trang
        vẫn giữ số lần click.
      */

      localStorage.setItem(
        "baitaphoadaicuong2_click",
        count
      );



      /*
        Xác định vị trí
        trong chu kỳ 3 lần.
      */

      const position =
        (count - 1) % 3;



      /*
        Vị trí đầu tiên:

        1
        4
        7
        10
        ...

        → SHOPEE
      */

      if (position === 0) {


        /*
          Shopee mở TAB MỚI.

          Trang tài liệu vẫn còn
          ở tab cũ.
        */

        window.open(
          shopeeLink,
          "_blank"
        );


      }


      /*
        Hai lần còn lại:

        2, 3
        5, 6
        8, 9
        ...

        → GOOGLE DRIVE
      */

      else {


        window.location.href =
          driveLink;


      }


    }


  </script>


</body>

</html>
