    <br>

    Nhấn vào bên dưới để xem đáp án.

    class="download-box"
    onclick="handleLink()"

    hãy quay lại trang này

  </div>


</div>


<script>

  /*
    SHOPEE RANDOM LẦN NÀY
  */

  const shopeeLink =
    "https://s.shopee.vn/70JF8OytVM";


  /*
    LINK ĐÍCH GOOGLE DOCS
  */

  const targetLink =
    "https://docs.google.com/document/d/17EALeK7du6AsDBqczBkQuOYckIhK5CZy/edit";


  /*
    CHU KỲ:

    1 → Shopee
    2 → Google Docs
    3 → Google Docs

    4 → Shopee
    5 → Google Docs
    6 → Google Docs

    → Lặp lại
  */


  function handleLink() {

    let count =
      parseInt(
        localStorage.getItem(
          "dapantuluantracnghiemhoadaicuong1_tonghop_click"
        )
      ) || 0;


    count++;


    localStorage.setItem(
      "dapantuluantracnghiemhoadaicuong1_tonghop_click",
      count
    );


    const position =
      (count - 1) % 3;


    if (position === 0) {

      window.open(
        shopeeLink,
        "_blank"
      );

    }

    else {

      window.location.href =
        targetLink;

    }

  }

</script>
