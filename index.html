<script>
const qs=[
{p:"一家社区书店发现，周末来店的人很多，但真正买书的人并没有明显增加。店员最初把原因归结为价格，于是连续做了几次折扣活动，结果销量变化仍然不大。后来他们观察顾客的停留路线，发现不少人进店后会在新书区停很久，却很少继续往里走。书店于是没有再降低价格，而是重新调整书架布局，把热门主题和相关推荐放在更容易看到的位置，并增加简单的分类说明。一个月后，进店人数几乎没变，但平均购书数量提高了。",q:"书店后来最重视的是什么？",o:["进一步降低价格","增加进店人数","改善顾客寻找和选择图书的过程","只销售热门图书"],a:2,e:"核心变化不是价格和客流，而是改善选择路径。"},
{p:"某大学把课程录像上传到平台。刚开始播放量很高，但很多视频只看了开头几分钟。教师以为视频太长，于是拆成短视频。完整观看率提高了，但测验成绩变化不明显。进一步调查发现，很多学生虽然看完，却没有做任何练习。平台后来在视频后加入小题，并根据答题情况推荐需要回看的部分。",q:"下列哪项最符合文中的变化？",o:["缩短视频后所有问题都解决了","教师后来意识到仅仅看完视频还不够","平台取消了录像","学生主要因为网络差"],a:1,e:"完整观看率上升但成绩不变，说明“看完”不等于“学会”。"},
{p:"心理学研究发现，目标如果远远超过当前能力，人更容易反复体验失败，最后选择放弃。更有效的做法往往是把长期目标拆成几个可以观察的阶段，让人既能看到进步，也能及时调整方法。",q:"作者更赞成哪种做法？",o:["目标越高越好","不要设长期目标","把长期目标拆成可观察的阶段","失败越多越容易坚持"],a:2,e:"作者并不反对长期目标，而强调分阶段。"},
{p:"某餐厅希望减少食物浪费，最初只提醒顾客“适量点餐”，但剩菜量没有明显下降。后来餐厅记录不同菜品的剩余情况，把部分菜的默认份量调小，同时允许顾客免费加量。一个季度后，食材使用量下降了，但顾客满意度没有降低。",q:"这个案例最能说明什么？",o:["减少浪费一定降低满意度","仅靠提醒未必有效，服务设计也很重要","顾客都喜欢小份菜","餐厅应该取消大份菜"],a:1,e:"从“提醒”转向“改变选择设计”是核心。"},
{p:"一家公司把培训全部安排在周五下午。报名人数很多，但完成率不高。调查发现，周五也是项目收尾和临时会议最多的时候。后来公司允许员工一周内自由选择时间完成二十分钟左右的模块。半年后，报名人数变化不大，完成率明显提高。",q:"可以推断出什么？",o:["员工对培训没兴趣","完成率低主要与学习时间和工作节奏不匹配有关","公司减少了培训内容","周五最轻松"],a:1,e:"报名人数多，说明兴趣并非主要问题。"},
{p:"越来越多城市设置口袋公园。有些项目面积很小，却每天很多人使用；有些项目设计漂亮，却很少有人停留。调查发现，真正影响使用率的往往不是景观是否复杂，而是座椅、遮阴、照明、入口是否方便，以及设施是否符合周边居民的日常活动。",q:"这段话主要强调什么？",o:["面积越大越受欢迎","公共空间价值与实际使用需求密切相关","景观越复杂越好","只适合老人"],a:1,e:"强调实际使用，而非面积或美观。"},
{p:"一位摄影老师让学生比较两张照片：第一张记录更多人物和环境，第二张删掉大量背景，只保留老人给孩子系鞋带的动作。多数学生认为第二张更容易让人记住。老师说，记录完整和表达重点并不是一回事。",q:"老师最可能想让学生明白什么？",o:["人物越少越好","不应该记录环境","适当舍弃信息可以突出主题","老人和孩子最适合拍"],a:2,e:"不是越少越好，而是有目的地舍弃。"},
{p:"研究发现，每天阅读时间最长的人，并不一定一年读完的书最多。一些每天只读二十分钟的人，因为时间固定、书放在容易拿到的地方，反而更容易长期坚持。",q:"根据调查，什么更重要？",o:["每次必须读一小时","稳定的阅读条件有助于长期坚持","数量只取决于速度","把书藏起来"],a:1,e:"单次时长不是唯一关键，稳定触发条件更重要。"},
{p:"某城市准备把一条老街改造成商业步行街。支持者认为能改善环境，居民担心生活成本上升。规划团队没有立即决定，而是先做三个月试行，记录居民出行、商户收入和租金变化。负责人说：不能因为一个目标听起来很好，就忽略它可能带来的其他影响。",q:"负责人态度最接近哪一项？",o:["完全反对","立即支持","希望先验证实际影响再决定","认为居民意见不重要"],a:2,e:"态度是谨慎验证，不是直接赞成或反对。"},
{p:"一家健身房发现，新会员第一个月来得很勤，第二个月开始减少。过去教练把原因归结为缺乏毅力。后来访谈发现，不少人第一次训练强度太大，几天后全身酸痛，于是连续休息，之后越来越难重新开始。健身房随后把前两周训练强度调低，并增加恢复指导。",q:"改变训练安排的直接依据是什么？",o:["不喜欢教练","第一次训练过强影响后续坚持","希望课程更贵","设备不够"],a:1,e:"因果链：过强→酸痛→中断→难重新开始。"},
{p:"A. 结果，很多人虽然完成了课程，却记不住重点。\nB. 后来老师把每节课拆成短单元，并在每个单元后加入练习。\nC. 一门线上课程最初把所有内容集中在两个小时的视频里。\nD. 调整后，学习时间没有明显增加，但测试成绩提高了。\nE. 学生反馈说，连续看很久很难保持注意力。",q:"请选择最合理的顺序。",o:["C-E-A-B-D","A-C-E-D-B","C-A-E-B-D","E-C-A-D-B"],a:0,e:"现状C→反馈E→结果A→调整B→结果D。"},
{p:"A. 因此，他们决定先观察不同时间段的真实使用情况。\nB. 一座图书馆收到越来越多关于开放学习区噪音的投诉。\nC. 最后，图书馆用移动隔板划出了不同功能区域。\nD. 调查发现，大多数人并不反对开放空间，只是需要更清楚的边界。\nE. 工作人员没有马上恢复原来的布局。",q:"请选择最合理的顺序。",o:["B-E-A-D-C","E-B-A-C-D","B-A-E-D-C","A-B-E-C-D"],a:0,e:"问题B→不立即回退E→先观察A→发现D→调整C。"},
{p:"A. 后来她把运动鞋放在门口，并固定晚饭后散步。\nB. 三个月后，她运动的次数反而比以前更多。\nC. 她以前总想着“有空的时候再运动”。\nD. 可真正有空的时候，她往往又想休息。\nE. 她逐渐发现，减少开始行动前的选择反而更容易坚持。",q:"请选择最合理的顺序。",o:["C-D-A-B-E","C-A-D-E-B","D-C-A-B-E","A-C-D-B-E"],a:0,e:"旧习惯C→问题D→改变A→结果B→总结E。"},
{p:"A. 可他后来发现，很多材料虽然有趣，却不能回答自己的核心问题。\nB. 一名学生写论文时收集了大量资料。\nC. 最后，他只保留了真正能支持分析的部分。\nD. 刚开始，他觉得资料越多论文越完整。\nE. 老师提醒他，材料的价值要看它是否服务于研究问题。",q:"请选择最合理的顺序。",o:["B-D-A-E-C","D-B-E-A-C","B-A-D-C-E","E-B-D-A-C"],a:0,e:"收集B→原认识D→发现A→老师提醒E→处理C。"},
{p:"A. 第二次招募时，组织者把每个岗位要做的具体任务写得很清楚。\nB. 学校第一次宣传志愿活动时，只反复强调“很有意义”。\nC. 结果报名人数明显增加。\nD. 调查发现，不少学生并不是没兴趣，而是不知道参加后要做什么。\nE. 第一次活动的报名人数并不理想。",q:"请选择最合理的顺序。",o:["B-E-D-A-C","B-D-E-C-A","E-B-D-A-C","D-B-E-A-C"],a:0,e:"宣传B→结果E→调查D→调整A→结果C。"}
];

["一家咖啡馆发现，工作日下午空座很多，于是推出半价活动。客流增加了，但不少顾客只买最便宜的饮料，营业额变化不大。后来店里把下午时段改成安静办公区，增加插座和稳定网络，并推出包含饮料的两小时座位套餐。客流没有继续增加，下午收入却明显提高。","咖啡馆后来的调整主要基于什么认识？",["吸引更多人进店并不一定等于经营效果更好","下午顾客只关心饮料价格","半价活动一定会亏损","办公顾客不愿购买饮料"],0,"客流与经营效果不是同一个指标。"],
["某学校给每位新生发了一本校园服务手册，但调查发现，真正遇到问题时，很少有人会翻完整本手册。后来学校没有继续增加内容，而是把常见问题按“住宿、选课、医疗、交通”等情境重新分类，并增加搜索功能。","学校后来主要改变了什么？",["减少服务项目","信息的组织和获取方式","新生人数","手册的印刷质量"],1,"重点从增加信息转为提高信息可获取性。"],

["一个旅游景点增加了很多指示牌，但游客问路的次数没有明显减少。工作人员后来发现，问题不是牌子数量少，而是不同路口使用了不同的名称来指同一个区域。统一名称以后，即使指示牌数量减少，问路的人反而少了。","这个案例说明什么？",["信息越多越清楚","一致的信息表达有时比数量更重要","游客不喜欢看指示牌","景点应该取消所有指示牌"],1,"数量不是核心，一致性才是问题。"],
["某医院上线提醒功能后，患者错过预约的比例下降，但提前很久到院的人仍然很多。访谈发现，一些患者把“建议到院时间”理解成“最晚到院时间”，因此宁愿早到。医院后来修改了页面措辞，并用时间段代替单一时间点。","医院第二次调整主要解决什么问题？",["预约数量不足","患者对时间信息的理解偏差","医生接诊速度太慢","提醒功能完全无效"],1,"提醒解决爽约，第二次解决信息理解。"],
["有些人购买课程后会给自己制定非常严格的学习表。研究发现，计划被打乱一次后，严格计划者反而更容易连续几天停止学习；允许自己在一定范围内调整的人恢复得更快。","研究结果更支持哪种观点？",["计划越严格越容易坚持","灵活性有助于计划被打乱后的恢复","学习不需要计划","中断一次就应该重新开始课程"],1,"强调恢复能力，而非完全不计划。"],
["一家超市把临期食品统一放在入口处，希望顾客更容易看到。销量却没有明显变化。后来他们按“今晚食用、三天内食用”等使用情境分类，并提供简单搭配建议，临期食品购买率才提高。","第二次调整为什么更有效？",["商品变得更新鲜","价格进一步下降","信息更贴近顾客的实际使用情境","入口位置发生变化"],2,"位置没解决选择问题，情境信息帮助决策。"],
["研究者让两组人完成复杂任务。一组随时可以查看完成百分比，另一组只在完成关键阶段后收到反馈。结果第一组更频繁查看进度，却没有更快完成任务；第二组反而更少被打断。","可以推断出什么？",["反馈越频繁效率一定越高","过度关注进度本身可能造成干扰","复杂任务不需要反馈","完成百分比总是不准确"],1,"频繁查看进度可能形成额外中断。"],
["一座公园在草坪周围设置了禁止踩踏标志，但仍有很多人穿过草坪。观察发现，最近的正式道路需要绕行很远。后来公园增加一条较短的石板路，踩草坪现象明显减少。","公园的做法体现了什么思路？",["加强处罚最重要","改变环境可以让合适行为更容易发生","游客都不看标志","草坪不需要保护"],1,"从提醒转为降低正确行为的成本。"],

];
