onclick="tab('s',this)">成绩</button></div></header><section id="r" class="sec on"><div class="c"><div id="rn" class="nav"></div><div id="rp" class="pge"></div><div id="rq" class="stem"></div><div id="ro"></div><div id="rf" class="fb"></div><div class="row"><button onclick="prevR()">←</button><button onclick="rex=!rex;renderR()">解析</button><button class="p" onclick="nextR()">→</button></div></div></section><section id="l" class="sec"><div class="c"><div id="ln" class="nav"></div><div id="lb"></div><div class="row"><button onclick="prevL()">←上一组</button><button onclick="lex=!lex;renderL()">解析</button><button class="p" onclick="nextL()">下一组→</button></div></div></section><section id="s" class="sec"><div class="c"><p>阅读</p><div id="rs" class="score"></div><p>听力</p><div id="ls" class="score"></div><button class="p" onclick="down()">下载结果 JSON</button></div></section></div><script>const R=[{"p": "某社区书店发现，周末进店人数很多，但购买量没有明显增加。店员最初认为是价格问题，于是做了多次折扣，销量仍变化不大。后来他们观察顾客路线，发现许多人会在新书区停很久，却很少继续往里走。书店于是重新调整书架，把热门主题和相关推荐放在更容易看到的位置，并增加分类说明。一个月后，进店人数几乎没变，但平均购书数量提高了。", "q": "书店后来最重视的是什么？", "o": ["提高折扣幅度以促进购买", "改善顾客寻找和选择图书的过程", "增加进入书店的顾客人数", "减少新书区的停留时间"], "a": 1, "e": "关键变化是改善选择路径，不是继续降价或增客流。"}, {"p": "某社区书店发现，周末进店人数很多，但购买量没有明显增加。店员最初认为是价格问题，于是做了多次折扣，销量仍变化不大。后来他们观察顾客路线，发现许多人会在新书区停很久，却很少继续往里走。书店于是重新调整书架，把热门主题和相关推荐放在更容易看到的位置，并增加分类说明。一个月后，进店人数几乎没变，但平均购书数量提高了。", "q": "哪项最符合材料中的因果关系？", "o": ["顾客减少停留以后购书量提高", "分类和陈列更清楚后购买效率改善", "热门图书减少后顾客选择更快", "折扣取消以后顾客更愿意购买"], "a": 1, "e": "材料支持“信息组织改善→购买效率提高”。"}, {"p": "一家网店发现，顾客把商品加入购物车后不付款的比例很高。运营人员原以为是价格问题，于是增加优惠券，但效果有限。后来他们发现，不少顾客在结账页面才看到运费和预计送达时间，因此会临时放弃。网店随后把这些信息提前显示在商品页，并允许顾客更早选择配送方式。", "q": "网店后来主要解决了什么问题？", "o": ["商品页面缺乏足够的折扣说明", "结账前关键信息出现得太晚", "配送方式数量无法满足需求", "顾客对商品本身缺少兴趣"], "a": 1, "e": "运费和送达时间出现太晚导致临时放弃。"}, {"p": "一家网店发现，顾客把商品加入购物车后不付款的比例很高。运营人员原以为是价格问题，于是增加优惠券，但效果有限。后来他们发现，不少顾客在结账页面才看到运费和预计送达时间，因此会临时放弃。网店随后把这些信息提前显示在商品页，并允许顾客更早选择配送方式。", "q": "如果新措施有效，最可能首先出现什么变化？", "o": ["加入购物车的人数明显下降", "结账阶段临时退出的人减少", "优惠券领取人数大幅提高", "顾客对商品质量评价上升"], "a": 1, "e": "措施直接针对“最后一步才发现信息而退出”。"}, {"p": "研究人员让两组学生准备同一场考试。一组每天学习新的章节，另一组每学完两章就安排一次综合复习。一个月后，第一组接触的内容更多，但在需要综合运用知识的题目上，第二组表现更稳定。", "q": "研究结果更支持哪种观点？", "o": ["学习效果不能只看接触内容的数量", "综合题主要依赖短期记忆能力", "减少新内容一定能提高成绩", "复习次数越多考试越容易"], "a": 0, "e": "“接触更多”不等于“综合表现更好”。"}, {"p": "研究人员让两组学生准备同一场考试。一组每天学习新的章节，另一组每学完两章就安排一次综合复习。一个月后，第一组接触的内容更多，但在需要综合运用知识的题目上，第二组表现更稳定。", "q": "第二组的优势主要体现在哪里？", "o": ["学习速度始终比第一组快", "对知识的综合运用更稳定", "接触的新章节数量更多", "每天学习时间明显更长"], "a": 1, "e": "材料只支持综合运用更稳定。"}, {"p": "某城市在公交站增加电子屏，显示车辆预计到站时间。调查发现，公交平均速度并没有明显提高，但乘客对等待的满意度上升了。很多人表示，知道还要等多久以后，即使实际等待时间没有缩短，也更容易安排接下来的事情。", "q": "哪项最符合文中的变化？", "o": ["公交速度提高带动满意度上升", "等待信息清楚后乘客体验改善", "候车人数减少后拥挤下降", "电子屏直接缩短了等待时间"], "a": 1, "e": "改善的是可预期性而不是客观速度。"}, {"p": "某城市在公交站增加电子屏，显示车辆预计到站时间。调查发现，公交平均速度并没有明显提高，但乘客对等待的满意度上升了。很多人表示，知道还要等多久以后，即使实际等待时间没有缩短，也更容易安排接下来的事情。", "q": "材料最能说明什么？", "o": ["服务体验有时受信息透明度影响", "等待时间越长满意度越高", "电子设备一定提高交通效率", "乘客更在意速度而不是信息"], "a": 0, "e": "客观时间未变但体验变好。"}, {"p": "一位老师发现，小组讨论中大家常常很快同意第一个发言者。后来他要求每个人先独立写下判断和理由，再开始交流。实施后，小组最终结论并没有明显变得更分散，但讨论中出现的不同理由明显增多。", "q": "老师的做法最可能减少哪种问题？", "o": ["学生表达能力不足", "早期意见对其他人判断的影响", "成员对任务目标理解不同", "讨论时间过长导致疲劳"], "a": 1, "e": "先独立判断可减少锚定/从众影响。"}, {"p": "一位老师发现，小组讨论中大家常常很快同意第一个发言者。后来他要求每个人先独立写下判断和理由，再开始交流。实施后，小组最终结论并没有明显变得更分散，但讨论中出现的不同理由明显增多。", "q": "实施以后，最明显的变化是什么？", "o": ["最终结论更加分散", "讨论理由更加多样", "发言人数明显减少", "小组更快结束讨论"], "a": 1, "e": "材料明确说不同理由明显增多。"}, {"p": "一家健身房推出连续打卡三十天的活动。开始时参与者很多，但第二周以后不少人因为某一天没来就彻底放弃。后来规则改成“每周完成四次即可”，并允许临时调整日期。完成整个活动的人数反而增加。", "q": "材料最想说明什么？", "o": ["严格要求更容易培养长期自律", "适度弹性有助于计划中断后的恢复", "每天运动比每周运动更有效", "降低目标会让所有人更有动力"], "a": 1, "e": "重点是恢复能力和弹性。"}, {"p": "一家健身房推出连续打卡三十天的活动。开始时参与者很多，但第二周以后不少人因为某一天没来就彻底放弃。后来规则改成“每周完成四次即可”，并允许临时调整日期。完成整个活动的人数反而增加。", "q": "原规则的主要问题是什么？", "o": ["参与者无法记录运动次数", "一次中断容易被理解为整个计划失败", "每周运动四次对多数人太难", "活动时间安排在工作日"], "a": 1, "e": "某一天没来后彻底放弃是关键。"}, {"p": "某博物馆把热门展品集中放在入口附近，希望游客一进门就看到重点。结果入口非常拥挤，后面的展厅却相对空闲。后来博物馆把部分热门展品分散到不同区域，并重新设计参观路线。总参观人数没有变化，但平均停留时间增加了。", "q": "调整展品位置的主要目的是什么？", "o": ["延长游客在入口的停留时间", "改善参观流线并减少局部拥挤", "让热门展品远离普通游客", "减少游客观看重点展品"], "a": 1, "e": "核心是重新分散人流。"}, {"p": "某博物馆把热门展品集中放在入口附近，希望游客一进门就看到重点。结果入口非常拥挤，后面的展厅却相对空闲。后来博物馆把部分热门展品分散到不同区域，并重新设计参观路线。总参观人数没有变化，但平均停留时间增加了。", "q": "调整后的结果最能说明什么？", "o": ["游客数量增加是停留变长的原因", "空间分配改变可以影响参观行为", "热门展品越分散越难被发现", "入口区域越小体验越好"], "a": 1, "e": "参观总人数不变但停留时间增加。"}, {"p": "一家公司每周发送很长的内部邮件，包括项目进展、政策变化和各种提醒。员工反映“信息很多，但重要的事反而容易错过”。后来公司把信息分成“必须处理、需要了解、可选阅读”三类，并在标题中直接标明。", "q": "公司后来主要改变了什么？", "o": ["减少内部信息的总数量", "提高信息优先级的可见性", "取消所有可选阅读内容", "要求员工固定时间阅读"], "a": 1, "e": "信息总量未必变，重点是优先级。"}, {"p": "一家公司每周发送很长的内部邮件，包括项目进展、政策变化和各种提醒。员工反映“信息很多，但重要的事反而容易错过”。后来公司把信息分成“必须处理、需要了解、可选阅读”三类，并在标题中直接标明。", "q": "员工原来的困难更接近哪一种？", "o": ["无法获得足够的信息", "难以判断哪些信息应优先处理", "缺少项目进展内容", "邮件发送时间太晚"], "a": 1, "e": "“重要的事容易错过”对应优先级不清。"}, {"p": "某大学食堂中午排队很长。食堂最初增加了一个收银窗口，但改善不明显。后来观察发现，很多学生在收银台前才开始决定吃什么。于是食堂把当天菜单和套餐组合提前展示在入口处。", "q": "为什么提前展示菜单能够改善拥堵？", "o": ["学生能更早完成选择，减少收银台前停留", "入口空间更大，可以容纳更多人", "套餐更便宜，因此付款速度更快", "菜单种类增加后决定更容易"], "a": 0, "e": "把选择行为提前是直接机制。"}, {"p": "某大学食堂中午排队很长。食堂最初增加了一个收银窗口，但改善不明显。后来观察发现，很多学生在收银台前才开始决定吃什么。于是食堂把当天菜单和套餐组合提前展示在入口处。", "q": "为什么增加收银窗口效果有限？", "o": ["真正瓶颈并不只在付款速度", "学生拒绝使用新的收银窗口", "新增窗口只在下午开放", "菜单价格同时出现上涨"], "a": 0, "e": "核心瓶颈是决策发生得太晚。"}, {"p": "研究发现，有些人每天都写非常详细的计划，但完成率并不高。他们常把“理想状态下能做多少”当成“现实中一定能做多少”。另一些人会主动预留时间处理临时任务，因此计划看起来没那么满，却更容易按时完成。", "q": "作者更赞成哪种计划方式？", "o": ["尽量安排满所有可用时间", "根据现实情况给计划留出余量", "把临时任务全部推迟到第二天", "只制定很容易完成的小目标"], "a": 1, "e": "强调给不确定性留空间。"}, {"p": "研究发现，有些人每天都写非常详细的计划，但完成率并不高。他们常把“理想状态下能做多少”当成“现实中一定能做多少”。另一些人会主动预留时间处理临时任务，因此计划看起来没那么满，却更容易按时完成。", "q": "前一种计划失败的核心原因是什么？", "o": ["目标数量太少", "忽略现实中的波动和临时情况", "计划没有使用数字工具", "任务本身缺乏吸引力"], "a": 1, "e": "把理想容量当成现实容量。"}, {"p": "一家咖啡馆工作日下午空座很多，于是推出半价活动。客流增加了，但不少顾客只买最便宜的饮料，营业额变化不大。后来店里把下午时段改成安静办公区，增加插座和稳定网络，并推出包含饮料的两小时座位套餐。客流没有继续增加，下午收入却明显提高。", "q": "咖啡馆后来的调整主要基于什么认识？", "o": ["吸引更多人并不一定等于经营效果更好", "下午顾客只关心饮料价格", "半价活动会让所有顾客减少消费", "办公顾客更愿意购买昂贵饮料"], "a": 0, "e": "客流和经营效果不是同一指标。"}, {"p": "一家咖啡馆工作日下午空座很多，于是推出半价活动。客流增加了，但不少顾客只买最便宜的饮料，营业额变化不大。后来店里把下午时段改成安静办公区，增加插座和稳定网络，并推出包含饮料的两小时座位套餐。客流没有继续增加，下午收入却明显提高。", "q": "哪项变化最能说明新方案更有效？", "o": ["客流继续快速增长", "收入提高但客流没有继续增加", "饮料价格明显下降", "顾客停留时间变短"], "a": 1, "e": "同样客流下收入提高体现效率改善。"}, {"p": "某学校给每位新生发校园服务手册，但真正遇到问题时，很少有人翻完整本。后来学校没有继续增加内容，而是把常见问题按“住宿、选课、医疗、交通”等情境重新分类，并增加搜索功能。", "q": "学校后来主要改变了什么？", "o": ["服务项目的数量", "信息的组织和获取方式", "新生咨询的时间", "手册的印刷质量"], "a": 1, "e": "从增加内容转向提高可找到性。"}, {"p": "某学校给每位新生发校园服务手册，但真正遇到问题时，很少有人翻完整本。后来学校没有继续增加内容，而是把常见问题按“住宿、选课、医疗、交通”等情境重新分类，并增加搜索功能。", "q": "材料最能说明什么？", "o": ["信息越多越能解决问题", "信息是否容易被找到同样重要", "纸质手册一定比搜索功能有效", "新生最关心的是住宿问题"], "a": 1, "e": "问题是获取方式，而非总量。"}, {"p": "一个旅游景点增加了很多指示牌，但游客问路次数没有明显减少。工作人员发现，不同路口使用了不同名称来指同一个区域。统一名称以后，即使指示牌数量减少，问路的人反而少了。", "q": "这个案例说明什么？", "o": ["信息数量越多越清楚", "一致的信息表达有时比数量更重要", "游客通常不会阅读指示牌", "景点应该减少所有文字说明"], "a": 1, "e": "核心是命名一致性。"}, {"p": "一个旅游景点增加了很多指示牌，但游客问路次数没有明显减少。工作人员发现，不同路口使用了不同名称来指同一个区域。统一名称以后，即使指示牌数量减少，问路的人反而少了。", "q": "原来的问题更接近哪一种？", "o": ["缺少指示牌", "信息之间存在不一致", "游客不熟悉地图", "主要区域过于分散"], "a": 1, "e": "同一区域多种名称造成混乱。"}, {"p": "某医院上线提醒功能后，患者错过预约的比例下降，但提前很久到院的人仍然很多。访谈发现，一些患者把“建议到院时间”理解成“最晚到院时间”，因此宁愿早到。医院后来修改页面措辞，并用时间段代替单一时间点。", "q": "第二次调整主要解决什么问题？", "o": ["预约数量不足", "患者对时间信息的理解偏差", "医生接诊速度太慢", "提醒功能无法正常发送"], "a": 1, "e": "第一次解决爽约，第二次解决理解。"}, {"p": "某医院上线提醒功能后，患者错过预约的比例下降，但提前很久到院的人仍然很多。访谈发现，一些患者把“建议到院时间”理解成“最晚到院时间”，因此宁愿早到。医院后来修改页面措辞，并用时间段代替单一时间点。", "q": "为什么单纯增加提醒不能解决第二个问题？", "o": ["提醒本身没有改变信息的含义", "患者完全不看任何通知", "提醒会让患者更晚到院", "短信只能在下午发送"], "a": 0, "e": "问题在措辞理解，而非提醒频率。"}, {"p": "有些人购买课程后给自己制定非常严格的学习表。研究发现，计划被打乱一次后，严格计划者更容易连续几天停止学习；允许自己在一定范围内调整的人恢复得更快。", "q": "研究结果更支持哪种观点？", "o": ["计划越严格越容易坚持", "灵活性有助于中断后的恢复", "学习不需要任何计划", "中断一次就应重新制定全部计划"], "a": 1, "e": "强调恢复能力。"}, {"p": "有些人购买课程后给自己制定非常严格的学习表。研究发现，计划被打乱一次后，严格计划者更容易连续几天停止学习；允许自己在一定范围内调整的人恢复得更快。", "q": "这里的“恢复”最接近什么意思？", "o": ["重新回到原来的学习节奏", "完全改变学习目标", "延长每天学习时间", "取消之前制定的计划"], "a": 0, "e": "恢复是从中断后重新继续。"}, {"p": "一家超市把临期食品统一放在入口处，希望顾客更容易看到。销量没有明显变化。后来他们按“今晚食用、三天内食用”等使用情境分类，并提供简单搭配建议，临期食品购买率才提高。", "q": "第二次调整为什么更有效？", "o": ["商品变得更新鲜", "价格进一步下降", "信息更贴近顾客实际使用情境", "入口位置发生了变化"], "a": 2, "e": "帮助顾客判断“何时/怎么用”。"}, {"p": "一家超市把临期食品统一放在入口处，希望顾客更容易看到。销量没有明显变化。后来他们按“今晚食用、三天内食用”等使用情境分类，并提供简单搭配建议，临期食品购买率才提高。", "q": "第一次调整隐含的假设是什么？", "o": ["看见商品就足以促成购买", "顾客主要担心食品安全", "搭配建议比价格更重要", "临期食品只适合当天吃"], "a": 0, "e": "第一次只解决可见性。"}, {"p": "研究者让两组人完成复杂任务。一组随时可以查看完成百分比，另一组只在完成关键阶段后收到反馈。第一组更频繁查看进度，却没有更快完成；第二组反而更少被打断。", "q": "可以推断出什么？", "o": ["反馈越频繁效率越高", "过度关注进度本身可能造成干扰", "复杂任务完全不需要反馈", "完成百分比通常不准确"], "a": 1, "e": "频繁查看进度形成额外中断。"}, {"p": "研究者让两组人完成复杂任务。一组随时可以查看完成百分比，另一组只在完成关键阶段后收到反馈。第一组更频繁查看进度，却没有更快完成；第二组反而更少被打断。", "q": "第二组的优势主要来自什么？", "o": ["收到的反馈内容更详细", "反馈时点更少打断工作过程", "他们的任务本身更简单", "他们不需要知道任何进度"], "a": 1, "e": "反馈集中在关键阶段。"}, {"p": "一座公园在草坪周围设置禁止踩踏标志，但仍有很多人穿过草坪。观察发现，最近的正式道路需要绕行很远。后来公园增加一条较短的石板路，踩草坪现象明显减少。", "q": "公园的做法体现了什么思路？", "o": ["加强处罚比环境设计重要", "让合适行为变得更容易发生", "游客通常不会看任何标志", "草坪保护主要依靠宣传"], "a": 1, "e": "降低正确行为的行动成本。"}, {"p": "一座公园在草坪周围设置禁止踩踏标志，但仍有很多人穿过草坪。观察发现，最近的正式道路需要绕行很远。后来公园增加一条较短的石板路，踩草坪现象明显减少。", "q": "为什么标志效果有限？", "o": ["替代路线的成本太高", "标志位置距离草坪太远", "游客不知道草坪需要保护", "石板路原来已经存在"], "a": 0, "e": "绕行很远使“正确选择”成本高。"}, {"p": "一家网店发现退货中有很多“尺寸不合适”。它没有先扩大尺码范围，而是比较不同品牌的实际尺寸，发现同一标号差异很大。后来商品页增加具体身体尺寸建议，退货率下降。", "q": "网店首先重新判断了什么？", "o": ["退货是否主要由尺码数量不足造成", "顾客是否喜欢在线购买衣服", "物流速度是否影响退货决定", "品牌数量是否应该减少"], "a": 0, "e": "重新定位问题：不是范围少，而是标号不可靠。"}, {"p": "一家网店发现退货中有很多“尺寸不合适”。它没有先扩大尺码范围，而是比较不同品牌的实际尺寸，发现同一标号差异很大。后来商品页增加具体身体尺寸建议，退货率下降。", "q": "新措施为何可能降低退货率？", "o": ["让顾客更容易匹配真实尺寸", "减少了可选择的品牌数量", "让所有品牌使用相同标号", "降低了退货处理费用"], "a": 0, "e": "具体身体尺寸信息提高匹配准确度。"}, {"p": "研究人员观察一批学习外语的成年人。坚持下来的人并不一定每天学得更久，却更常把学习和固定场景联系起来：早餐后听十分钟、通勤时复习单词、每周固定和朋友练口语。总等“有整块时间再学”的人更容易连续几天完全不学习。", "q": "坚持下来的人更可能具有什么特点？", "o": ["每天学习时间最长", "把学习和固定场景联系起来", "只练习一种技能", "从不改变学习材料"], "a": 1, "e": "核心是固定触发条件。"}, {"p": "研究人员观察一批学习外语的成年人。坚持下来的人并不一定每天学得更久，却更常把学习和固定场景联系起来：早餐后听十分钟、通勤时复习单词、每周固定和朋友练口语。总等“有整块时间再学”的人更容易连续几天完全不学习。", "q": "材料对“整块时间”的态度是什么？", "o": ["它是长期学习的必要条件", "过度等待它可能增加中断机会", "它比固定习惯更有效", "只有工作日才需要整块时间"], "a": 1, "e": "总等待整块时间的人更容易断。"}];const S=[["女：你不是说要买那件外套吗？\n男：本来想买，可我回去看了看，家里已经有两件差不多的。再买只是因为打折，不是真的需要。\n问：男的最后为什么没买外套？", ["尺码不合适", "发现自己并不真正需要", "颜色和预期不同", "准备等价格更低"], 1], ["男：明天不是一起去爬山吗？\n女：天气预报说下午可能有雷雨。我想了想，还是把活动改到上午吧，路线也短一点。\n问：女的建议怎么调整？", ["改到上午并缩短路线", "取消活动改到下周", "下午出发避开高峰", "改成室内活动"], 0], ["女：你最近怎么不用那个学习软件了？\n男：功能挺多，就是提醒太频繁。我本来想靠它提高效率，结果反而总被打断。\n问：男的主要不满意什么？", ["软件价格太高", "提醒影响了专注", "功能数量太少", "学习记录会丢失"], 1], ["男：这家餐厅评分比旁边高，为什么不进去？\n女：评分是高，不过服务员说至少等五十分钟。旁边那家现在有位子，我更想早点吃完回去。\n问：女的最看重什么？", ["网上评分", "环境安静", "等待时间", "菜品种类"], 2], ["女：听说你报名了摄影比赛？\n男：本来报了，可论文下周就要交。我还是先把论文完成，比赛以后还有机会。\n问：男的是什么意思？", ["已经交了作品", "暂时把论文放一边", "决定先完成论文", "以后不再参赛"], 2], ["男：你怎么把书桌搬到客厅了？\n女：卧室虽然安静，可白天光线太暗。我试了几天，发现客厅反而更适合看书。\n问：女的为什么搬书桌？", ["客厅空间更大", "卧室噪音太多", "想改善阅读光线", "准备换家具"], 2], ["女：你每天跑五公里还不够吗？怎么突然加到十公里？\n男：我以为这样进步快，昨天跑完膝盖有点疼。教练让我先恢复两天，再慢慢增加。\n问：男的接下来最可能怎么做？", ["继续跑十公里", "停止运动一个月", "先休息再逐渐增加", "每天改成游泳"], 2], ["男：这个课程评价不错，你怎么还没报名？\n女：内容我很感兴趣，不过时间正好和实验课冲突。我先看看有没有下一期。\n问：女的为什么没有报名？", ["内容不适合她", "评价不够高", "时间安排有冲突", "已经报了下一期"], 2], ["女：你不是要坐地铁去机场吗？\n男：原来这么打算，但今天带两个大箱子，换乘两次太麻烦。我还是提前叫车吧。\n问：男的最后决定怎么去机场？", ["坐地铁", "坐公交", "叫车", "让朋友送"], 2], ["男：这本书你不是说前面很无聊吗？\n女：前面确实有点慢，不过后半部分越来越有意思，最后我一天就看完了。\n问：女的总体态度怎么样？", ["总体认可", "非常失望", "觉得太难", "没有读完"], 0]];const LG=[["一所大学去年开始开放夜间自习区。刚开始时，学校只把开放时间从晚上六点延长到九点，没想到使用人数迅速增加。可是过了一段时间，投诉也变多：有人找不到插座，有人觉得讨论声太大，还有人希望能买到简单饮料和食物。学校没有继续单纯延长时间，而是调查不同人群的使用需求。后来他们把空间分成安静区和讨论区，增加插座，并在入口设置自动售货机。调整后，夜间使用人数没有继续大幅增加，但满意度明显提高。", [["学校最初采取了什么措施？", ["增加学习座位", "延长夜间开放时间", "取消讨论区域", "提供免费餐饮"], 1], ["后来学生主要反映了什么？", ["开放时间还是太短", "空间和配套不能满足不同需求", "夜间学习人数太少", "学校限制进入"], 1], ["调整以后发生了什么变化？", ["使用人数翻倍", "满意度明显提高", "开放时间缩短", "投诉完全消失"], 1]]], ["一家连锁餐厅发现，高峰期顾客经常因为等位离开。管理层最初认为增加座位就能解决，于是重新摆放桌椅，多增加了十几张座位。但一个月后，离开的顾客仍然很多。后来访谈发现，很多人真正不满意的不是等待本身，而是不知道要等多久。于是餐厅开始在入口显示预计等候时间，并通过手机及时更新座位情况。调整以后，平均等待时间变化不大，但中途离开的顾客明显减少。", [["餐厅最初如何解决问题？", ["减少菜单种类", "增加可用座位", "缩短营业时间", "提高服务员数量"], 1], ["后来发现顾客真正不满意什么？", ["等待时间无法预期", "餐厅环境太吵", "菜品价格上涨", "服务员态度不好"], 0], ["新措施实施后，什么没有明显变化？", ["顾客离开比例", "平均等待时间", "手机使用人数", "可用座位数量"], 1]]], ["研究人员观察一批想养成运动习惯的人。开始时，很多人都制定了很高的目标，例如每天跑五公里、每周去健身房六次。一个月以后，坚持情况差别很大。真正坚持下来的人并不一定目标最高，而是更容易把运动放进固定场景：晚饭后马上散步、把运动鞋放在门口、每周固定和朋友锻炼。研究者认为，当一个行为每次都需要重新决定“今天要不要做”时，更容易被其他事情打断。", [["开始时很多人有什么共同做法？", ["设定较高运动目标", "只做低强度运动", "固定和朋友锻炼", "完全不制定计划"], 0], ["坚持下来的人更可能有什么特点？", ["每天运动最长", "依靠固定场景触发行动", "购买更多装备", "从不改变方式"], 1], ["为什么临时决定容易中断？", ["运动本身太难", "每次开始增加行动成本", "朋友经常改计划", "目标通常不够高"], 1]]], ["某学校为了提高在线课程完成率，最初把每节课拆成更短的视频。完整观看率确实提高了，但考试成绩没有明显改善。后来教师分析学习记录发现，不少学生会连续看完几个视频，却很少停下来做练习。于是第二阶段没有继续缩短视频，而是在每个单元后加入两三道小题，并根据错误情况推荐需要回看的内容。一个学期后，学生观看视频总时间变化不大，但综合题正确率明显上升。", [["第一次改革主要改变了什么？", ["增加练习数量", "缩短视频长度", "减少课程章节", "提高考试难度"], 1], ["第一次改革后什么没明显改善？", ["完整观看率", "考试成绩", "学习记录数量", "视频播放次数"], 1], ["第二阶段改革重点是什么？", ["让学习与练习结合", "继续减少视频时间", "取消综合题", "增加更多新知识"], 0]]], ["一个旅游平台发现，用户选酒店时经常打开十几个页面反复比较。平台最初增加更多筛选条件，希望帮助用户更快决定。没想到，一些用户反而花了更长时间，因为开始比较更多细节。后来平台改变方式：先让用户选择三个最重要的条件，例如位置、安静程度或预算，再只推荐少量符合核心条件的酒店。测试结果显示，用户做决定的平均时间缩短了，而且取消预订的比例也有所下降。", [["平台最初采取了什么办法？", ["减少酒店数量", "增加筛选条件", "限制比较时间", "隐藏部分价格"], 1], ["为什么最初办法效果不好？", ["用户开始比较更多细节", "酒店信息经常错误", "筛选条件太少", "推荐速度太慢"], 0], ["后来平台主要改变了什么？", ["先帮助用户明确优先条件", "只推荐最高评分酒店", "取消所有筛选功能", "要求提前付款"], 0]]], ["一家医院发现，很多已经预约的复诊患者仍集中在早上八九点到院，候诊区很拥挤。医院最初以为患者不了解预约制度，于是增加短信提醒，但效果有限。访谈后发现，预约页面虽然写了“建议到院时间”，不少患者却把它理解成“最晚到院时间”，因此宁愿提前很久到。医院随后重新设计页面，把单一时间点改成明确的到院时间段，并说明提前过多并不会更早就诊。", [["医院最初认为问题出在哪里？", ["患者不了解预约制度", "医生接诊速度太慢", "短信系统经常故障", "候诊区面积太小"], 0], ["后来发现患者为什么过早到院？", ["担心错过公交", "误解页面时间信息", "希望先做其他检查", "医院要求提前一小时"], 1], ["第二次采取了什么措施？", ["增加更多短信", "重新设计时间信息表达", "延长医生工作时间", "取消网上预约"], 1]]], ["一家出版社发现，电子书用户常在一本书读到一半时停止。团队最初以为是内容太长，于是增加“预计剩余阅读时间”功能。数据显示，中途停止比例略有下降，但变化有限。后来进一步分析发现，很多人会在章节结束后中断，而且下次打开时忘了上次读到的重点。于是平台增加自动生成的章节摘要和阅读进度提示。", [["第一次调整主要针对什么？", ["阅读内容难度", "剩余时间的不确定感", "章节数量太多", "字体显示问题"], 1], ["后来发现的另一个问题是什么？", ["用户不知道书的价格", "重新阅读时难恢复上下文", "章节结束太突然", "摘要内容太长"], 1], ["第二次调整的核心目的是什么？", ["减少电子书长度", "帮助用户重新进入阅读状态", "让用户更快购买下一本书", "提高章节阅读速度"], 1]]], ["一家学校发现，家长会通知经常被忽略。老师原以为家长没时间看消息，于是把同一通知连续发送三次。结果不少家长觉得信息太多，反而把群消息设成免打扰。后来学校把所有重要日期汇总成每周一次的简短提醒，并把需要家长完成的事项放在最前面。", [["最初的做法带来了什么结果？", ["家长查看率明显提高", "部分家长关闭了消息提醒", "通知内容被大幅减少", "家长会取消了"], 1], ["学校后来如何调整？", ["增加发送频率", "每周汇总并突出行动事项", "改成每天电话通知", "只发送给部分家长"], 1], ["新做法体现了什么原则？", ["降低信息噪音并突出重点", "重要信息应该重复越多越好", "通知越长越容易被看见", "所有信息都应同时发送"], 0]]], ["一家旅行用品店发现，顾客常在货架前比较很久，却迟迟不买。店员最初增加了更多参数标签，例如重量、材料和尺寸，但效果不明显。后来访谈发现，很多顾客不是缺参数，而是不知道不同产品适合什么场景。于是店里增加“适合短途徒步”“适合雨季旅行”等使用说明。", [["最初措施为什么效果有限？", ["顾客不关心任何参数", "参数没有直接回答使用场景问题", "标签数量太少", "商品价格太高"], 1], ["后来店里主要增加了什么信息？", ["产品生产地点", "具体使用情境", "更多技术参数", "顾客个人资料"], 1], ["这个案例最能说明什么？", ["信息应服务于实际决策", "参数越多越专业", "顾客通常不懂产品", "场景说明比价格更重要"], 0]]], ["某公司准备更换办公软件。技术部门最喜欢功能最多的A系统，财务部门更看重价格较低的B系统。试用后发现，A系统功能丰富但培训成本很高；B系统价格低，却无法与现有数据库连接。最后公司选择功能相对少一些、但能直接接入现有流程的C系统。", [["技术部门最初看重什么？", ["系统价格", "功能数量", "培训成本", "数据库兼容性"], 1], ["B系统的主要问题是什么？", ["功能太多", "无法连接现有数据库", "价格太高", "培训时间太长"], 1], ["公司最后的选择体现什么？", ["功能数量最重要", "价格越低越合适", "实际适配性比单一指标更关键", "不同部门意见无法统一"], 2]]]];
