<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HSK 5 · 3.0 模拟考试 01</title>
  <style>
:root{--bg:#eef2f6;--paper:#fff;--ink:#1d2835;--muted:#6d7885;--line:#d9e0e7;--brand:#1769aa;--brand2:#0f4f82;--ok:#2f8f5b;--warn:#e6a019;--danger:#b83a3a;--font:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;color:var(--ink);font-size:var(--font)}button,input,textarea{font:inherit}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:48px;height:48px;background:var(--brand);color:#fff;border-radius:8px;display:grid;place-items:center;font-weight:800}.brand strong,.brand span{display:block}.brand span{font-size:12px;color:var(--muted);margin-top:2px}.top-actions{display:flex;gap:10px;align-items:center}.timer{font-variant-numeric:tabular-nums;font-weight:800;background:#f3f7fa;border:1px solid var(--line);padding:10px 16px;border-radius:7px;min-width:112px;text-align:center}.icon-btn,.ghost-btn,.flag-btn,.nav-btn{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:7px;cursor:pointer}.danger-btn{background:var(--danger);border:0;color:#fff;padding:10px 18px;border-radius:7px;cursor:pointer}.section-tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);padding-left:28px}.section-tab{padding:14px 26px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}.section-tab.active{color:var(--brand);border-bottom-color:var(--brand)}.exam-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;max-width:1400px;margin:20px auto;padding:0 20px}.sidebar,.paper{background:#fff;border:1px solid var(--line);border-radius:10px}.sidebar{padding:18px;height:calc(100vh - 140px);position:sticky;top:132px;overflow:auto}.candidate-card{display:flex;gap:10px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#eaf3fb;color:var(--brand);font-weight:800}.candidate-card span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:14px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.dot.answered{background:var(--ok)}.dot.current{background:var(--brand)}.dot.blank{background:#cbd3db}.question-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.qbtn{height:38px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;color:var(--muted);position:relative}.qbtn.answered{background:#eaf7f0;border-color:#b9dfca;color:#226942}.qbtn.current{outline:3px solid #cfe6f8;border-color:var(--brand);color:var(--brand);font-weight:800}.qbtn.flagged:after{content:"";position:absolute;right:3px;top:3px;width:7px;height:7px;background:var(--warn);border-radius:50%}.full{width:100%}.sidebar .full{margin-top:16px}.paper{min-height:calc(100vh - 140px);padding:30px 42px;display:flex;flex-direction:column}.paper-head{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px}.paper h1{font-size:1.35em;margin:6px 0 0}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:800}.flag-btn.active{background:#fff7dc;border-color:#e8c468;color:#8d6712}.passage{background:#f7f9fb;border-left:4px solid var(--brand);padding:18px 20px;line-height:1.9;margin:22px 0}.question-body{line-height:1.85;margin:26px 0 16px;white-space:pre-wrap}.options{display:grid;gap:12px;max-width:900px}.option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;transition:.12s}.option:hover{border-color:#90bfe3;background:#f8fbfe}.option.selected{border-color:var(--brand);background:#edf6fd}.option-letter{font-weight:800;min-width:24px;color:var(--brand)}.nav-footer{margin-top:auto;padding-top:30px;display:flex;align-items:center;justify-content:space-between}.nav-btn.primary,.primary-btn{background:var(--brand);color:#fff;border-color:var(--brand)}.nav-btn:disabled{opacity:.4;cursor:not-allowed}.audio-area{background:#f0f6fb;border:1px solid #cbddec;border-radius:8px;padding:14px 16px;margin-top:20px;display:flex;align-items:center;gap:12px}.audio-play{border:0;background:var(--brand2);color:#fff;border-radius:6px;padding:10px 15px;cursor:pointer}.audio-play:disabled{opacity:.45}.audio-note{font-size:13px;color:var(--muted)}.writing-box{width:100%;min-height:330px;border:1px solid var(--line);border-radius:8px;padding:18px;resize:vertical;line-height:1.8;outline:none}.writing-box:focus{border-color:var(--brand);box-shadow:0 0 0 3px #dceefa}.counter{text-align:right;color:var(--muted);font-size:13px;margin-top:8px}.speaking-card{border:1px solid var(--line);border-radius:8px;padding:20px}.record-controls{display:flex;gap:10px;align-items:center;margin-top:16px}.record-btn{border:0;background:var(--danger);color:#fff;padding:10px 15px;border-radius:6px;cursor:pointer}.record-btn.stop{background:#333}.record-time{font-variant-numeric:tabular-nums;font-weight:800}.download-link{display:inline-block;margin-top:12px;color:var(--brand)}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:rgba(17,28,39,.62);z-index:50;display:none;place-items:center;padding:20px}.overlay.show{display:grid}.modal{background:#fff;border-radius:12px;box-shadow:0 25px 60px rgba(0,0,0,.25);padding:32px;max-width:620px;width:100%;max-height:90vh;overflow:auto}.start-modal{text-align:center}.modal-badge{display:inline-block;color:var(--brand);background:#eaf3fb;padding:6px 10px;border-radius:999px;font-weight:800;font-size:13px}.start-modal h2{font-size:30px;margin:12px 0}.start-modal p{color:var(--muted);line-height:1.6}.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0;text-align:left}.rules div{border:1px solid var(--line);border-radius:8px;padding:12px}.rules strong,.rules span{display:block}.rules span{color:var(--muted);font-size:13px;margin-top:3px}.checkline{display:flex;gap:8px;align-items:center;justify-content:center;margin:18px 0}.primary-btn{border:0;padding:12px 18px;border-radius:7px;cursor:pointer}.small-note{font-size:12px!important}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.score-card{background:#f6f8fa;border-radius:8px;padding:16px;text-align:center}.score-card strong{display:block;font-size:25px}.score-card span{font-size:12px;color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}@media(max-width:900px){.exam-layout{grid-template-columns:1fr}.sidebar{position:static;height:auto}.topbar{padding:0 12px}.brand span{display:none}.paper{padding:22px}.section-tabs{overflow:auto;padding-left:10px}.section-tab{white-space:nowrap;padding:12px 16px}.question-grid{grid-template-columns:repeat(10,1fr)}}

</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">HSK</div>
        <div><strong>HSK 五级 · 模拟考试 01</strong><span>Computer Based Test</span></div>
      </div>
      <div class="top-actions">
        <button id="fontDown" class="icon-btn" title="缩小字号">A−</button>
        <button id="fontUp" class="icon-btn" title="放大字号">A+</button>
        <div class="timer" id="timer">01:50:00</div>
        <button id="submitBtn" class="danger-btn">交卷</button>
      </div>
    </header>

    <div class="section-tabs" id="sectionTabs"></div>

    <main class="exam-layout">
      <aside class="sidebar">
        <div class="candidate-card">
          <div class="avatar">考</div>
          <div><strong>模拟考生</strong><span id="progressText">0 / 72 已答</span></div>
        </div>
        <div class="legend">
          <span><i class="dot answered"></i>已答</span>
          <span><i class="dot current"></i>当前</span>
          <span><i class="dot blank"></i>未答</span>
        </div>
        <div id="questionGrid" class="question-grid"></div>
        <button id="resetBtn" class="ghost-btn full">清除本地进度</button>
      </aside>

      <section class="paper">
        <div class="paper-head">
          <div>
            <div id="partLabel" class="eyebrow"></div>
            <h1 id="questionTitle"></h1>
          </div>
          <button id="flagBtn" class="flag-btn">☆ 标记</button>
        </div>
        <div id="audioArea" class="audio-area hidden"></div>
        <div id="passage" class="passage hidden"></div>
        <div id="questionBody" class="question-body"></div>
        <div id="options" class="options"></div>
        <div id="writingArea" class="hidden"></div>
        <div id="speakingArea" class="hidden"></div>

        <footer class="nav-footer">
          <button id="prevBtn" class="nav-btn">← 上一题</button>
          <span id="navStatus"></span>
          <button id="nextBtn" class="nav-btn primary">下一题 →</button>
        </footer>
      </section>
    </main>
  </div>

  <div id="startOverlay" class="overlay show">
    <div class="modal start-modal">
      <div class="modal-badge">HSK 5 · 3.0</div>
      <h2>模拟考试 01</h2>
      <p>本网页会保存你的选择和作文到当前浏览器。正式模拟时建议使用电脑、全屏并关闭其他网页。</p>
      <div class="rules">
        <div><strong>听力</strong><span>35 题 · 约 25 分钟</span></div>
        <div><strong>阅读</strong><span>35 题 · 35 分钟</span></div>
        <div><strong>写作</strong><span>2 题 · 40 分钟</span></div>
        <div><strong>口语</strong><span>独立练习 · 可录音</span></div>
      </div>
      <label class="checkline"><input type="checkbox" id="strictMode" checked /> 听力练习每题只允许播放一次</label>
      <button id="startBtn" class="primary-btn full">开始考试</button>
      <p class="small-note">没有 MP3 也能使用浏览器中文语音进行练习；后续可把真人录音放进 audio 文件夹。</p>
    </div>
  </div>

  <div id="resultOverlay" class="overlay">
    <div class="modal result-modal">
      <h2>考试结果</h2>
      <div id="resultContent"></div>
      <div class="modal-actions">
        <button id="closeResult" class="ghost-btn">返回检查</button>
        <button id="downloadResult" class="primary-btn">下载答题记录</button>
      </div>
    </div>
  </div>

  <script>

B":"弄错了地址","C":"忘了带文件","D":"取消了预约"},"audioText":"男：真不好意思，我把合同落在办公室了。\n女：没关系，你发电子版给我也可以。\n问：男的为什么道歉？"},{"id":7,"type":"mcq","section":"listening","part":"听力理解","prompt":"两人是什么关系？","options":{"A":"医生和病人","B":"房东和租客","C":"老师和学生","D":"顾客和店员"},"audioText":"女：厨房的水龙头又漏水了。\n男：我今天下班后过去看看，要是修不好就找师傅。\n问：两人是什么关系？"},{"id":8,"type":"mcq","section":"listening","part":"听力理解","prompt":"女的担心什么？","options":{"A":"天气变化","B":"航班延误","C":"行李超重","D":"忘带护照"},"audioText":"女：这个箱子是不是太重了？航空公司限二十公斤。\n男：我们先称一下，超了就把书拿出来。\n问：女的担心什么？"},{"id":9,"type":"mcq","section":"listening","part":"听力理解","prompt":"男的态度怎么样？","options":{"A":"犹豫","B":"赞成","C":"生气","D":"失望"},"audioText":"女：我想把每周例会缩短到四十分钟，把材料提前发给大家。\n男：这个办法不错，能省下不少时间。\n问：男的态度怎么样？"},{"id":10,"type":"mcq","section":"listening","part":"听力理解","prompt":"女的下一步最可能做什么？","options":{"A":"去取快递","B":"联系物业","C":"继续等电梯","D":"爬楼梯"},"audioText":"女：电梯怎么停运了？\n男：物业说半小时后才能恢复。\n女：那我还是走上去吧，才六层。\n问：女的下一步最可能做什么？"},{"id":11,"type":"mcq","section":"listening","part":"听力理解","prompt":"男的为什么没参加聚餐？","options":{"A":"身体不舒服","B":"临时加班","C":"没收到通知","D":"要去接孩子"},"audioText":"女：昨天部门聚餐怎么没见你？\n男：本来要去的，客户临时改方案，我一直忙到九点。\n问：男的为什么没参加聚餐？"},{"id":12,"type":"mcq","section":"listening","part":"听力理解","prompt":"女的买这件衣服最看重什么？","options":{"A":"价格","B":"颜色","C":"材质","D":"品牌"},"audioText":"男：这件比旁边那件贵不少。\n女：可它是纯羊毛的，摸起来舒服，我更在意材质。\n问：女的买这件衣服最看重什么？"},{"id":13,"type":"mcq","section":"listening","part":"听力理解","prompt":"男的建议怎么处理？","options":{"A":"马上拒绝","B":"先了解原因","C":"请领导决定","D":"重新签合同"},"audioText":"女：对方突然提出延期交货，我们怎么办？\n男：先问清楚是什么原因，再决定要不要调整计划。\n问：男的建议怎么处理？"},{"id":14,"type":"mcq","section":"listening","part":"听力理解","prompt":"女的为什么高兴？","options":{"A":"论文通过了","B":"找到新工作","C":"获得奖学金","D":"旅行计划确定了"},"audioText":"男：你今天看起来特别开心。\n女：学校刚通知我，我申请的奖学金批下来了。\n问：女的为什么高兴？"},{"id":15,"type":"mcq","section":"listening","part":"听力理解","prompt":"男的主要提醒什么？","options":{"A":"别开太快","B":"早点出发","C":"带上雨伞","D":"改乘火车"},"audioText":"女：明天七点的飞机，我五点半出门够吗？\n男：最近机场高速在修路，你最好再提前一点。\n问：男的主要提醒什么？"},{"id":16,"type":"mcq","section":"listening","part":"听力理解","prompt":"女的认为活动效果怎么样？","options":{"A":"不如预期","B":"非常成功","C":"报名人数太少","D":"宣传时间太短"},"audioText":"男：这次线上讲座有两百多人报名，不少啊。\n女：是，不过真正听完的人只有一半，比我们预计的少。\n问：女的认为活动效果怎么样？"},{"id":17,"type":"mcq","section":"listening","part":"听力理解","prompt":"男的为什么换餐厅？","options":{"A":"太远","B":"没位置","C":"菜太辣","D":"价格上涨"},"audioText":"女：不是说去老地方吃吗？\n男：我刚打电话问过，今晚已经订满了，只能换一家。\n问：男的为什么换餐厅？"},{"id":18,"type":"mcq","section":"listening","part":"听力理解","prompt":"女的想表达什么？","options":{"A":"需要更多证据","B":"数据完全错误","C":"报告写得太长","D":"研究没有价值"},"audioText":"男：我觉得结论已经很清楚了。\n女：方向是清楚，但样本太少，最好再补一些数据。\n问：女的想表达什么？"},{"id":19,"type":"mcq","section":"listening","part":"听力理解","prompt":"男的最后决定怎么做？","options":{"A":"退货","B":"换颜色","C":"继续使用","D":"送给朋友"},"audioText":"男：这副耳机颜色和图片不太一样。\n女：如果不喜欢可以七天内退。\n男：算了，音质挺好的，我就不折腾了。\n问：男的最后决定怎么做？"},{"id":20,"type":"mcq","section":"listening","part":"听力理解","prompt":"图书馆最初为什么只延长到九点？","options":{"A":"担心工作人员不足","B":"不确定晚间需求","C":"附近交通不方便","D":"设备尚未安装"},"audioText":"社区图书馆去年开始推出“夜间自习室”。最初工作人员担心晚上来的人不多，只试着把闭馆时间从六点延长到九点。没想到附近不少上班族和大学生都来使用，周末甚至需要提前预约。后来图书馆增加了插座、饮水机和简餐区，还设置了安静学习区与讨论区。负责人说，他们并不是单纯延长开放时间，而是根据使用者真正的需要重新设计服务。\n问：图书馆最初为什么只延长到九点？"},{"id":21,"type":"mcq","section":"listening","part":"听力理解","prompt":"周末出现了什么情况？","options":{"A":"必须提前预约","B":"只对学生开放","C":"经常提前关门","D":"不能使用讨论区"},"audioText":"社区图书馆去年开始推出“夜间自习室”。最初工作人员担心晚上来的人不多，只试着把闭馆时间从六点延长到九点。没想到附近不少上班族和大学生都来使用，周末甚至需要提前预约。后来图书馆增加了插座、饮水机和简餐区，还设置了安静学习区与讨论区。负责人说，他们并不是单纯延长开放时间，而是根据使用者真正的需要重新设计服务。\n问：周末出现了什么情况？"},{"id":22,"type":"mcq","section":"listening","part":"听力理解","prompt":"后来图书馆增加了什么？","options":{"A":"儿童游乐区","B":"运动设施","C":"学习配套设施","D":"免费住宿区"},"audioText":"社区图书馆去年开始推出“夜间自习室”。最初工作人员担心晚上来的人不多，只试着把闭馆时间从六点延长到九点。没想到附近不少上班族和大学生都来使用，周末甚至需要提前预约。后来图书馆增加了插座、饮水机和简餐区，还设置了安静学习区与讨论区。负责人说，他们并不是单纯延长开放时间，而是根据使用者真正的需要重新设计服务。\n问：后来图书馆增加了什么？"},{"id":23,"type":"mcq","section":"listening","part":"听力理解","prompt":"这段话主要说明什么？","options":{"A":"图书馆要减少服务","B":"服务应根据真实需求调整","C":"上班族不爱学习","D":"夜间开放成本太高"},"audioText":"社区图书馆去年开始推出“夜间自习室”。最初工作人员担心晚上来的人不多，只试着把闭馆时间从六点延长到九点。没想到附近不少上班族和大学生都来使用，周末甚至需要提前预约。后来图书馆增加了插座、饮水机和简餐区，还设置了安静学习区与讨论区。负责人说，他们并不是单纯延长开放时间，而是根据使用者真正的需要重新设计服务。\n问：这段话主要说明什么？"},{"id":24,"type":"mcq","section":"listening","part":"听力理解","prompt":"餐厅首先做了什么？","options":{"A":"减少菜单","B":"记录剩余量","C":"提高价格","D":"缩短营业时间"},"audioText":"一家餐厅为了减少食物浪费，开始记录每天各类菜品的剩余量。一个月后，他们发现并不是所有菜都做多了，而是某些菜在工作日和周末的需求差别很大。于是厨师根据历史数据调整备菜量，并把部分不影响口味的食材改成“少量多次”准备。三个月后，食物浪费下降了约三成，顾客等餐时间也没有明显增加。经理认为，关键不是一味少做，而是更准确地判断需求。\n问：餐厅首先做了什么？"},{"id":25,"type":"mcq","section":"listening","part":"听力理解","prompt":"他们发现需求有什么特点？","options":{"A":"每天完全一样","B":"周末总是更少","C":"不同日期差别明显","D":"只受天气影响"},"audioText":"一家餐厅为了减少食物浪费，开始记录每天各类菜品的剩余量。一个月后，他们发现并不是所有菜都做多了，而是某些菜在工作日和周末的需求差别很大。于是厨师根据历史数据调整备菜量，并把部分不影响口味的食材改成“少量多次”准备。三个月后，食物浪费下降了约三成，顾客等餐时间也没有明显增加。经理认为，关键不是一味少做，而是更准确地判断需求。\n问：他们发现需求有什么特点？"},{"id":26,"type":"mcq","section":"listening","part":"听力理解","prompt":"“少量多次”主要用于什么？","options":{"A":"降低员工工资","B":"减少浪费","C":"增加宣传","D":"改变口味"},"audioText":"一家餐厅为了减少食物浪费，开始记录每天各类菜品的剩余量。一个月后，他们发现并不是所有菜都做多了，而是某些菜在工作日和周末的需求差别很大。于是厨师根据历史数据调整备菜量，并把部分不影响口味的食材改成“少量多次”准备。三个月后，食物浪费下降了约三成，顾客等餐时间也没有明显增加。经理认为，关键不是一味少做，而是更准确地判断需求。\n问：“少量多次”主要用于什么？"},{"id":27,"type":"mcq","section":"listening","part":"听力理解","prompt":"经理认为最关键的是什么？","options":{"A":"少做所有菜","B":"准确判断需求","C":"让顾客提前点餐","D":"取消热门菜"},"audioText":"一家餐厅为了减少食物浪费，开始记录每天各类菜品的剩余量。一个月后，他们发现并不是所有菜都做多了，而是某些菜在工作日和周末的需求差别很大。于是厨师根据历史数据调整备菜量，并把部分不影响口味的食材改成“少量多次”准备。三个月后，食物浪费下降了约三成，顾客等餐时间也没有明显增加。经理认为，关键不是一味少做，而是更准确地判断需求。\n问：经理认为最关键的是什么？"},{"id":28,"type":"mcq","section":"listening","part":"听力理解","prompt":"小周刚工作时有什么想法？","options":{"A":"不想做技术工作","B":"认为专业知识已经够用","C":"准备马上辞职","D":"只相信老师傅"},"audioText":"小周大学毕业后进入一家制造企业。刚开始，他觉得自己的专业知识已经足够，遇到问题总想独立解决。一次设备故障让生产线停了两个小时，他反复检查仍找不到原因。老师傅过来后，只问了几个问题就发现是一个很小的传感器出了问题。小周这才意识到，经验并不是书本知识的简单重复。此后他会把每天遇到的问题记下来，下班前主动向同事请教，并定期整理解决方法。半年后，他处理现场问题的速度明显提高。\n问：小周刚工作时有什么想法？"},{"id":29,"type":"mcq","section":"listening","part":"听力理解","prompt":"设备故障的原因是什么？","options":{"A":"软件崩溃","B":"电源中断","C":"一个传感器问题","D":"操作人员迟到"},"audioText":"小周大学毕业后进入一家制造企业。刚开始，他觉得自己的专业知识已经足够，遇到问题总想独立解决。一次设备故障让生产线停了两个小时，他反复检查仍找不到原因。老师傅过来后，只问了几个问题就发现是一个很小的传感器出了问题。小周这才意识到，经验并不是书本知识的简单重复。此后他会把每天遇到的问题记下来，下班前主动向同事请教，并定期整理解决方法。半年后，他处理现场问题的速度明显提高。\n问：设备故障的原因是什么？"},{"id":30,"type":"mcq","section":"listening","part":"听力理解","prompt":"后来小周养成了什么习惯？","options":{"A":"每天加班很晚","B":"主动记录并请教","C":"只看专业书","D":"避免自己处理问题"},"audioText":"小周大学毕业后进入一家制造企业。刚开始，他觉得自己的专业知识已经足够，遇到问题总想独立解决。一次设备故障让生产线停了两个小时，他反复检查仍找不到原因。老师傅过来后，只问了几个问题就发现是一个很小的传感器出了问题。小周这才意识到，经验并不是书本知识的简单重复。此后他会把每天遇到的问题记下来，下班前主动向同事请教，并定期整理解决方法。半年后，他处理现场问题的速度明显提高。\n问：后来小周养成了什么习惯？"},{"id":31,"type":"mcq","section":"listening","part":"听力理解","prompt":"这段话最想说明什么？","options":{"A":"经验需要在实践中积累","B":"大学知识没有用","C":"设备故障很常见","D":"制造业工作很轻松"},"audioText":"小周大学毕业后进入一家制造企业。刚开始，他觉得自己的专业知识已经足够，遇到问题总想独立解决。一次设备故障让生产线停了两个小时，他反复检查仍找不到原因。老师傅过来后，只问了几个问题就发现是一个很小的传感器出了问题。小周这才意识到，经验并不是书本知识的简单重复。此后他会把每天遇到的问题记下来，下班前主动向同事请教，并定期整理解决方法。半年后，他处理现场问题的速度明显提高。\n问：这段话最想说明什么？"},{"id":32,"type":"mcq","section":"listening","part":"听力理解","prompt":"两组人的任务是什么？","options":{"A":"跑步","B":"记忆","C":"写作","D":"讨论"},"audioText":"研究者曾请两组人完成同样的记忆任务。第一组连续学习四十分钟，第二组每学习十分钟就短暂休息。结果显示，第二组不仅完成速度更快，之后回忆的信息也更多。研究者解释说，大脑长时间保持高度集中会逐渐疲劳，适当的短休息能帮助恢复注意力。不过，休息并不等于不停地刷短视频，因为新的信息刺激可能让大脑更难回到原来的任务。散步、喝水或看看远处，通常更有帮助。\n问：两组人的任务是什么？"},{"id":33,"type":"mcq","section":"listening","part":"听力理解","prompt":"哪一组表现更好？","options":{"A":"第一组","B":"第二组","C":"完全一样","D":"文中没有说"},"audioText":"研究者曾请两组人完成同样的记忆任务。第一组连续学习四十分钟，第二组每学习十分钟就短暂休息。结果显示，第二组不仅完成速度更快，之后回忆的信息也更多。研究者解释说，大脑长时间保持高度集中会逐渐疲劳，适当的短休息能帮助恢复注意力。不过，休息并不等于不停地刷短视频，因为新的信息刺激可能让大脑更难回到原来的任务。散步、喝水或看看远处，通常更有帮助。\n问：哪一组表现更好？"},{"id":34,"type":"mcq","section":"listening","part":"听力理解","prompt":"为什么短休息有帮助？","options":{"A":"能增加新信息","B":"能恢复注意力","C":"能延长任务时间","D":"能提高手机速度"},"audioText":"研究者曾请两组人完成同样的记忆任务。第一组连续学习四十分钟，第二组每学习十分钟就短暂休息。结果显示，第二组不仅完成速度更快，之后回忆的信息也更多。研究者解释说，大脑长时间保持高度集中会逐渐疲劳，适当的短休息能帮助恢复注意力。不过，休息并不等于不停地刷短视频，因为新的信息刺激可能让大脑更难回到原来的任务。散步、喝水或看看远处，通常更有帮助。\n问：为什么短休息有帮助？"},{"id":35,"type":"mcq","section":"listening","part":"听力理解","prompt":"作者不建议休息时做什么？","options":{"A":"喝水","B":"散步","C":"看远处","D":"刷短视频"},"audioText":"研究者曾请两组人完成同样的记忆任务。第一组连续学习四十分钟，第二组每学习十分钟就短暂休息。结果显示，第二组不仅完成速度更快，之后回忆的信息也更多。研究者解释说，大脑长时间保持高度集中会逐渐疲劳，适当的短休息能帮助恢复注意力。不过，休息并不等于不停地刷短视频，因为新的信息刺激可能让大脑更难回到原来的任务。散步、喝水或看看远处，通常更有帮助。\n问：作者不建议休息时做什么？"},{"id":36,"type":"mcq","section":"reading","part":"阅读理解 · 第一部分","prompt":"随着远程办公越来越普遍，很多公司开始重新思考办公室的作用。过去办公室主要是完成日常工作的地方，现在它更强调____和合作。","options":{"A":"交流","B":"运输","C":"收藏","D":"人口"}},{"id":37,"type":"mcq","section":"reading","part":"阅读理解 · 第一部分","prompt":"有些人制定计划时把每天安排得很满，一旦发生意外就容易全部被打乱。因此，合理的计划应该给自己留出一定的____。","options":{"A":"利润","B":"余地","C":"根据","D":"连续"}},{"id":38,"type":"mcq","section":"reading","part":"阅读理解 · 第一部分","prompt":"这家博物馆没有简单地把文物放进玻璃柜，而是通过灯光、声音和互动装置，让参观者更容易____当时的生活环境。","options":{"A":"想象","B":"担心","C":"消失","D":"准备"}},{"id":39,"type":"mcq","section":"reading","part":"阅读理解 · 第一部分","prompt":"面对网上大量信息，我们不仅要看内容是否吸引人，更要判断来源是否可靠，避免被未经____的消息误导。","options":{"A":"说明","B":"制造","C":"证实","D":"配合"}},{"id":40,"type":"mcq","section":"reading","part":"阅读理解 · 第一部分","prompt":"运动并不一定要追求高强度。对大多数人来说，长期坚持比偶尔一次的剧烈运动更____。","options":{"A":"有限","B":"关键","C":"生动","D":"自然"}},{"id":41,"type":"mcq","section":"reading","part":"阅读理解 · 第一部分","prompt":"企业推出新产品前，通常会先进行小范围测试，根据用户反馈不断____细节。","options":{"A":"调整","B":"记录","C":"拒绝","D":"分布"}},{"id":42,"type":"mcq","section":"reading","part":"阅读理解 · 第一部分","prompt":"有经验的老师不会只告诉学生答案，而会通过提问____学生自己发现问题。","options":{"A":"命令","B":"引导","C":"怀疑","D":"隐藏"}},{"id":43,"type":"mcq","section":"reading","part":"阅读理解 · 第一部分","prompt":"城市里增加自行车道，不仅能方便短距离出行，也有助于____交通压力。","options":{"A":"缓解","B":"担心","C":"制造","D":"开始"}},{"id":44,"type":"mcq","section":"reading","part":"阅读理解 · 第一部分","prompt":"真正有效的沟通，不只是把自己的意见说清楚，还要认真听对方的____。","options":{"A":"程度","B":"立场","C":"材料","D":"规模"}},{"id":45,"type":"mcq","section":"reading","part":"阅读理解 · 第一部分","prompt":"这项研究的结论目前只是初步结果，还需要更多数据来____。","options":{"A":"支持","B":"消除","C":"替换","D":"推迟"}},{"id":46,"type":"mcq","section":"reading","part":"阅读理解 · 第二部分","prompt":"根据这段话，下列哪项正确？","passage":"越来越多年轻人选择在旅行中学习当地手艺，例如做陶器、织布或烹饪。这样做不仅能获得纪念品，还能更深入地理解当地文化。","options":{"A":"旅行中学习手艺能帮助理解文化","B":"年轻人旅行只为了买纪念品","C":"传统手艺已经不适合现代生活","D":"学习手艺一定要长期居住"}},{"id":47,"type":"mcq","section":"reading","part":"阅读理解 · 第二部分","prompt":"根据这段话，下列哪项正确？","passage":"很多团队开会时容易陷入一个问题：发言最多的人不一定最了解情况，而真正掌握细节的人可能因为不善表达而沉默。因此，主持人应主动给不同成员发言机会。","options":{"A":"会议越长越有效","B":"主持人应鼓励多方表达","C":"沉默的人一定没有意见","D":"发言多说明能力强"}},{"id":48,"type":"mcq","section":"reading","part":"阅读理解 · 第二部分","prompt":"根据这段话，下列哪项正确？","passage":"有些应用会用连续签到、积分奖励等方式鼓励用户养成习惯。这些机制短期内很有效，但如果用户只为了奖励而行动，一旦奖励消失，习惯也可能停止。","options":{"A":"奖励越多习惯越稳定","B":"外部奖励可能难以形成长期动力","C":"签到机制完全没有用","D":"习惯必须依靠惩罚形成"}},{"id":49,"type":"mcq","section":"reading","part":"阅读理解 · 第二部分","prompt":"根据这段话，下列哪项正确？","passage":"一位医生提醒，体检报告中的单个指标异常并不一定意味着生病，还需要结合年龄、生活方式和其他检查结果综合判断。","options":{"A":"任何异常指标都代表疾病","B":"体检没有参考价值","C":"判断健康状况要看多方面信息","D":"年龄与体检结果无关"}},{"id":50,"type":"mcq","section":"reading","part":"阅读理解 · 第二部分","prompt":"根据这段话，下列哪项正确？","passage":"一些城市把废旧工厂改造成艺术园区，既保留工业建筑的历史特点，又为展览、工作室和公共活动提供空间。","options":{"A":"旧工厂只能拆除","B":"改造能同时保留历史并创造新用途","C":"艺术园区不适合公共活动","D":"工业建筑没有文化价值"}},{"id":51,"type":"mcq","section":"reading","part":"阅读理解 · 第二部分","prompt":"根据这段话，下列哪项正确？","passage":"阅读速度快并不等于理解得深。遇到复杂文章时，适当停下来整理作者的逻辑，往往比一味追求页数更有效。","options":{"A":"读得越快理解越深","B":"复杂文章不应该停下来","C":"理解文章需要关注逻辑","D":"阅读数量比理解更重要"}},{"id":52,"type":"mcq","section":"reading","part":"阅读理解 · 第二部分","prompt":"根据这段话，下列哪项正确？","passage":"有些公司允许员工每周拿出少量时间研究与本职工作相关但不属于当前任务的想法。很多创新项目正是在这样的探索中产生的。","options":{"A":"所有创新都来自正式任务","B":"适当探索可能带来创新","C":"员工不应研究额外想法","D":"创新与工作无关"}},{"id":53,"type":"mcq","section":"reading","part":"阅读理解 · 第二部分","prompt":"根据这段话，下列哪项正确？","passage":"学习外语时，很多人害怕犯错而不愿开口。事实上，只有在真实交流中暴露问题，才能知道哪些地方需要改进。","options":{"A":"不犯错才能学好语言","B":"真实交流有助于发现问题","C":"初学者不应该开口","D":"语法比交流更重要"}},{"id":54,"type":"mcq","section":"reading","part":"阅读理解 · 第二部分","prompt":"根据这段话，下列哪项正确？","passage":"一些家庭开始使用智能电表查看不同时段的用电量。看到具体数据后，他们更容易发现哪些电器耗电较多，从而调整使用习惯。","options":{"A":"智能电表能自动降低电费","B":"具体数据有助于改变用电习惯","C":"所有电器耗电都一样","D":"家庭不需要了解用电量"}},{"id":55,"type":"mcq","section":"reading","part":"阅读理解 · 第二部分","prompt":"根据这段话，下列哪项正确？","passage":"同样一份反馈，如果只说“做得不好”，对改进帮助有限；如果指出具体问题并给出可执行建议，接受者更容易采取行动。","options":{"A":"反馈应该越简短越好","B":"批评不需要理由","C":"具体建议更有改进价值","D":"接受反馈的人不应行动"}},{"id":56,"type":"mcq","section":"reading","part":"阅读理解 · 第三部分","prompt":"有人最初为什么不喜欢“自然观察角”？","passage":"近几年，不少城市在公园里设置“自然观察角”，保留落叶、枯木和小水池。有人一开始觉得这些地方看起来“不够整齐”，但生态工作者解释，枯木能为昆虫提供栖息地，落叶分解后可以改善土壤，小水池则能吸引鸟类和两栖动物。经过一段时间，许多市民发现，这些看似“不整理”的区域反而让公园里出现了更多生物。城市绿地的目标不只是好看，也要给自然留下空间。","options":{"A":"觉得不够整齐","B":"担心门票涨价","C":"那里没有座椅","D":"面积太大"}},{"id":57,"type":"mcq","section":"reading","part":"阅读理解 · 第三部分","prompt":"枯木有什么作用？","passage":"近几年，不少城市在公园里设置“自然观察角”，保留落叶、枯木和小水池。有人一开始觉得这些地方看起来“不够整齐”，但生态工作者解释，枯木能为昆虫提供栖息地，落叶分解后可以改善土壤，小水池则能吸引鸟类和两栖动物。经过一段时间，许多市民发现，这些看似“不整理”的区域反而让公园里出现了更多生物。城市绿地的目标不只是好看，也要给自然留下空间。","options":{"A":"改善照明","B":"为昆虫提供栖息地","C":"减少游客数量","D":"增加停车位"}},{"id":58,"type":"mcq","section":"reading","part":"阅读理解 · 第三部分","prompt":"作者认为城市绿地还应该重视什么？","passage":"近几年，不少城市在公园里设置“自然观察角”，保留落叶、枯木和小水池。有人一开始觉得这些地方看起来“不够整齐”，但生态工作者解释，枯木能为昆虫提供栖息地，落叶分解后可以改善土壤，小水池则能吸引鸟类和两栖动物。经过一段时间，许多市民发现，这些看似“不整理”的区域反而让公园里出现了更多生物。城市绿地的目标不只是好看，也要给自然留下空间。","options":{"A":"商业价值","B":"自然生态","C":"建筑高度","D":"运动比赛"}},{"id":59,"type":"mcq","section":"reading","part":"阅读理解 · 第三部分","prompt":"这种课程要求学生课前做什么？","passage":"一所大学把部分大课改成“课前看短视频、课堂解决问题”的形式。开始时，有学生觉得课前任务增加了负担，但一个学期后，很多人发现课堂上能有更多时间讨论难点。教师也不再把大部分时间用来重复教材，而是根据学生提交的问题调整课堂内容。调查显示，学生对知识的掌握更扎实，但前提是课前准备必须真正完成。","options":{"A":"参加考试","B":"看短视频","C":"写长论文","D":"做实验"}},{"id":60,"type":"mcq","section":"reading","part":"阅读理解 · 第三部分","prompt":"教师课堂内容根据什么调整？","passage":"一所大学把部分大课改成“课前看短视频、课堂解决问题”的形式。开始时，有学生觉得课前任务增加了负担，但一个学期后，很多人发现课堂上能有更多时间讨论难点。教师也不再把大部分时间用来重复教材，而是根据学生提交的问题调整课堂内容。调查显示，学生对知识的掌握更扎实，但前提是课前准备必须真正完成。","options":{"A":"教材页数","B":"学生问题","C":"天气情况","D":"教室大小"}},{"id":61,"type":"mcq","section":"reading","part":"阅读理解 · 第三部分","prompt":"这种方式有效的前提是什么？","pa tions":{"A":"昂贵设备","B":"偶然运气","C":"耐心与准备","D":"更多游客"}},{"id":68,"type":"mcq","section":"reading","part":"阅读理解 · 第三部分","prompt":"电脑笔记有什么特点？","passage":"某研究团队比较了纸质笔记和电脑笔记。结果发现，用电脑的人通常记录得更多、更快，但容易逐字抄下老师的话；用纸笔的人因为写得慢，反而会主动筛选和整理信息。研究者并没有因此认为纸笔一定更好，而是提醒学习者：工具本身不是关键，关键在于是否对信息进行了加工。即使用电脑，如果能用自己的话总结，也同样可以达到较好的学习效果。","options":{"A":"记录通常更少","B":"速度较快","C":"无法整理信息","D":"只能用于考试"}},{"id":69,"type":"mcq","section":"reading","part":"阅读理解 · 第三部分","prompt":"纸笔记录为什么可能更有利于理解？","passage":"某研究团队比较了纸质笔记和电脑笔记。结果发现，用电脑的人通常记录得更多、更快，但容易逐字抄下老师的话；用纸笔的人因为写得慢，反而会主动筛选和整理信息。研究者并没有因此认为纸笔一定更好，而是提醒学习者：工具本身不是关键，关键在于是否对信息进行了加工。即使用电脑，如果能用自己的话总结，也同样可以达到较好的学习效果。","options":{"A":"写得更快","B":"会主动筛选信息","C":"字更漂亮","D":"不用思考"}},{"id":70,"type":"mcq","section":"reading","part":"阅读理解 · 第三部分","prompt":"作者最强调什么？","passage":"某研究团队比较了纸质笔记和电脑笔记。结果发现，用电脑的人通常记录得更多、更快，但容易逐字抄下老师的话；用纸笔的人因为写得慢，反而会主动筛选和整理信息。研究者并没有因此认为纸笔一定更好，而是提醒学习者：工具本身不是关键，关键在于是否对信息进行了加工。即使用电脑，如果能用自己的话总结，也同样可以达到较好的学习效果。","options":{"A":"必须使用纸笔","B":"工具价格","C":"信息加工方式","D":"电脑不能学习"}},{"id":71,"type":"writing","section":"writing","part":"写作 · 第71题","prompt":"看图写故事（不少于100字）","passage":"请根据下面四个画面提示，写一篇不少于100字的作文，写出发生在王宇和同学们身上的故事。\n\n① 放学后，王宇发现教室窗边有一盆快枯萎的植物。\n② 他和同学查资料，发现植物长期缺水、光照也不足。\n③ 大家分工：有人浇水，有人换位置，有人制作“照顾记录表”。\n④ 两周后植物重新长出新叶，大家很高兴。","minChars":100},{"id":72,"type":"writing","section":"writing","part":"写作 · 第72题","prompt":"话题写作（不少于200字）","passage":"有人说：“效率高并不等于把时间安排得越满越好。”请结合自己的学习、工作或生活经历，谈谈你对这句话的理解。","minChars":200},{"id":73,"type":"speaking","section":"speaking","part":"口语 · 听后复述","prompt":"第1题：听录音后复述。","audioText":"一家小公司每周五下午都会安排半小时，让员工分享这一周遇到的问题。开始时大家觉得这会浪费工作时间，后来却发现，很多问题其实其他同事早就遇到过。通过交流，大家能更快找到解决办法，还能避免不同部门重复犯同样的错误。现在，这个分享会已经成了公司最受欢迎的活动之一。"},{"id":74,"type":"speaking","section":"speaking","part":"口语 · 听后复述","prompt":"第2题：听录音后复述。","audioText":"有位老人每天早上都去同一家面包店买早餐。店员注意到，他总会多买一个面包，却从不带回家。后来才知道，老人会把那个面包送给路口值夜班的保安。老人说，这并不是什么大事，只是自己顺手能做的一点小事。时间久了，店员也开始偶尔为保安准备一杯热豆浆。"},{"id":75,"type":"speaking","section":"speaking","part":"口语 · 看图说话","prompt":"第3题：请根据以下三幅连续画面讲一个完整故事。","passage":"① 一名女生在公交车站发现地上有一个钱包。\n② 她打开钱包只查看了联系方式，并打电话联系失主。\n③ 失主赶来取回钱包，向她道谢；女生微笑离开。"},{"id":76,"type":"speaking","section":"speaking","part":"口语 · 回答问题","prompt":"第4题：你认为“失败的经历”对一个人的成长有什么作用？请结合例子说明。"},{"id":77,"type":"speaking","section":"speaking","part":"口语 · 回答问题","prompt":"第5题：现在很多人习惯通过短视频获取知识。你认为这种学习方式有哪些优点和局限？"}]};

function formatTime(x){x=Math.max(0,x);return `${String(Math.floor(x/3600)).padStart(2,'0')}:${String(Math.floor((x%3600)/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`}
function renderTabs(){const sec=sectionFor(state.current);$('#sectionTabs').innerHTML=D.sections.map(s=>`<button class="section-tab ${sec.id===s.id?'active':''}" data-sec="${s.id}">${s.label}${s.id==='speaking'?' · 练习':''}</button>`).join('');document.querySelectorAll('.section-tab').forEach(b=>b.onclick=()=>{const s=D.sections.find(x=>x.id===b.dataset.sec);state.current=s.range[0];render();});}
function renderGrid(){const sec=sectionFor(state.current);let ids=[];for(let i=sec.range[0];i<=sec.range[1];i++) ids.push(i);$('#questionGrid').innerHTML=ids.map(id=>{const answered=id<=70?!!state.answers[id]:id<=72?!!(state.writing[id]||'').trim():!!state.recordings[id];return `<button class="qbtn ${answered?'answered':''} ${id===state.current?'current':''} ${state.flags[id]?'flagged':''}" data-id="${id}">${id<=72?id:id-72}</button>`}).join('');document.querySelectorAll('.qbtn').forEach(b=>b.onclick=()=>{state.current=+b.dataset.id;render();});$('#progressText').textContent=`${qCountAnswered()} / 72 已答`}
function renderAudio(q){const a=$('#audioArea');if(!q.audioText){a.classList.add('hidden');a.innerHTML='';return}a.classList.remove('hidden');const disabled=state.strict&&state.played[q.id];a.innerHTML=`<button class="audio-play" ${disabled?'disabled':''}>▶ ${disabled?'已播放':'播放听力'}</button><span class="audio-note">${state.strict?'严格模式：每题仅一次':'练习模式：可重复播放'} · 不显示原文</span>`;a.querySelector('button').onclick=()=>playText(q)}
function playText(q){if(state.strict&&state.played[q.id])return;if(!('speechSynthesis'in window)){alert('此浏览器不支持语音播放。请使用 Chrome/Edge，或换成真人 MP3。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.audioText);u.lang='zh-CN';u.rate=.92;const voices=speechSynthesis.getVoices();const zh=voices.find(v=>/zh|Chinese|Mandarin/i.test(v.lang+' '+v.name));if(zh)u.voice=zh;speechSynthesis.speak(u);state.played[q.id]=true;save();renderAudio(q)}
function renderMCQ(q){$('#questionBody').textContent=q.prompt;$('#options').innerHTML=Object.entries(q.options).map(([k,v])=>`<div class="option ${state.answers[q.id]===k?'selected':''}" data-k="${k}"><span class="option-letter">${k}</span><span>${v}</span></div>`).join('');document.querySelectorAll('.option').forEach(o=>o.onclick=()=>{state.answers[q.id]=o.dataset.k;save();render();});}
function renderWriting(q){const w=$('#writingArea');w.classList.remove('hidden');const val=state.writing[q.id]||'';w.innerHTML=`<textarea class="writing-box" placeholder="请在这里输入作文……"></textarea><div class="counter"><span id="charCount">${countChars(val)}</span> / 最少 ${q.minChars} 字</div>`;const ta=w.querySelector('textarea');ta.value=val;ta.oninput=()=>{state.writing[q.id]=ta.value;$('#charCount').textContent=countChars(ta.value);save();renderGrid();};}
function countChars(t){return (t.match(/[\u3400-\u9fffA-Za-z0-9]/g)||[]).length}
function renderSpeaking(q){const s=$('#speakingArea');s.classList.remove('hidden');const rec=state.recordings[q.id];s.innerHTML=`<div class="speaking-card"><p>点击录音后开始作答。录音只保存在当前页面内，建议完成后立即下载。</p><div class="record-controls"><button class="record-btn" id="recordBtn">● 开始录音</button><span class="record-time" id="recordTime">00:00</span></div>${rec?`<a class="download-link" id="recordDownload" href="${rec.url}" download="HSK5_Speaking_Q${q.id-72}.webm">下载本题录音</a>`:''}</div>`;$('#recordBtn').onclick=()=>toggleRecord(q.id)}
async function toggleRecord(id){const btn=$('#recordBtn');if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();btn.textContent='● 开始录音';btn.classList.remove('stop');clearInterval(recordTimer);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);recordSeconds=0;mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=()=>{const blob=new Blob(chunks,{type:'audio/webm'});const url=URL.createObjectURL(blob);state.recordings[id]={blob,url};stream.getTracks().forEach(t=>t.stop());render();};mediaRecorder.start();btn.textContent='■ 停止录音';btn.classList.add('stop');recordTimer=setInterval(()=>{recordSeconds++;const el=$('#recordTime');if(el)el.textContent=`${String(Math.floor(recordSeconds/60)).padStart(2,'0')}:${String(recordSeconds%60).padStart(2,'0')}`},1000);}catch(e){alert('无法使用麦克风。请允许浏览器麦克风权限，并使用 HTTPS/GitHub Pages。')}}
function render(){const q=qById(state.current),sec=sectionFor(state.current);renderTabs();renderGrid();$('#partLabel').textContent=q.part;$('#questionTitle').textContent=q.type==='speaking'?q.prompt:`第 ${q.id} 题`;$('#passage').classList.toggle('hidden',!q.passage);$('#passage').textContent=q.passage||'';$('#questionBody').textContent='';$('#options').innerHTML='';$('#writingArea').classList.add('hidden');$('#writingArea').innerHTML='';$('#speakingArea').classList.add('hidden');$('#speakingArea').innerHTML='';renderAudio(q);if(q.type==='mcq')renderMCQ(q);if(q.type==='writing'){$('#questionBody').textContent=q.prompt;renderWriting(q)}if(q.type==='speaking')renderSpeaking(q);$('#flagBtn').classList.toggle('active',!!state.flags[q.id]);$('#flagBtn').textContent=state.flags[q.id]?'★ 已标记':'☆ 标记';$('#prevBtn').disabled=q.id===1;$('#nextBtn').disabled=q.id===77;$('#navStatus').textContent=`${sec.label} · ${q.id-sec.range[0]+1} / ${sec.range[1]-sec.range[0]+1}`;document.documentElement.style.setProperty('--font',state.font+'px');}
function start(){state.strict=$('#strictMode').checked;state.started=true;$('#startOverlay').classList.remove('show');clearInterval(tick);tick=setInterval(()=>{state.seconds--;$('#timer').textContent=formatTime(state.seconds);if(state.seconds%5===0)save();if(state.seconds<=0){clearInterval(tick);showResult(true)}},1000);render();}
function showResult(auto=false){const total=70;let correct=0;for(let i=1;i<=70;i++)if(state.answers[i]===D.answerKey[i])correct++;let l=0,r=0;for(let i=1;i<=35;i++)if(state.answers[i]===D.answerKey[i])l++;for(let i=36;i<=70;i++)if(state.answers[i]===D.answerKey[i])r++;const blanks=[];for(let i=1;i<=70;i++)if(!state.answers[i])blanks.push(i);$('#resultContent').innerHTML=`${auto?'<p><strong>时间到，系统已自动交卷。</strong></p>':''}<div class="result-grid"><div class="score-card"><strong>${correct}/${total}</strong><span>客观题</span></div><div class="score-card"><strong>${l}/35</strong><span>听力</span></div><div class="score-card"><strong>${r}/35</strong><span>阅读</span></div></div><p>未答客观题：${blanks.length?blanks.join('、'):'无'}</p><p>写作：第71题 ${countChars(state.writing[71]||'')} 字；第72题 ${countChars(state.writing[72]||'')} 字。</p><p style="color:#6d7885">写作和口语不自动评分。可把作文与录音交给老师/ChatGPT按评分维度批改。</p>`;$('#resultOverlay').classList.add('show')}
function downloadResult(){const data={exam:'HSK5 3.0 模拟考试 01',date:new Date().toISOString(),objectiveAnswers:state.answers,writing:state.writing,remainingSeconds:state.seconds};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='HSK5_Mock01_Result.json';a.click();URL.revokeObjectURL(a.href)}
$('#startBtn').onclick=start;$('#submitBtn').onclick=()=>{if(confirm('确定交卷吗？仍可返回检查。'))showResult(false)};$('#closeResult').onclick=()=>$('#resultOverlay').classList.remove('show');$('#downloadResult').onclick=downloadResult;$('#prevBtn').onclick=()=>{if(state.current>1){state.current--;render()}};$('#nextBtn').onclick=()=>{if(state.current<77){state.current++;render()}};$('#flagBtn').onclick=()=>{state.flags[state.current]=!state.flags[state.current];save();render()};$('#fontUp').onclick=()=>{state.font=Math.min(24,state.font+1);save();render()};$('#fontDown').onclick=()=>{state.font=Math.max(15,state.font-1);save();render()};$('#resetBtn').onclick=()=>{if(confirm('清除全部选择、作文和计时进度？')){localStorage.removeItem('hsk5_mock01_state');location.reload()}};
$('#timer').textContent=formatTime(state.seconds);render();
})();

</script>
