function renderCollocCards(){
  const box=document.getElementById("collocCards");
  if(!box) return;
  box.innerHTML=COLLOCS.map(x=>`
    <div style="border:1px solid #e5e7eb;border-radius:10px;padding:11px;background:#fafafa">

function csave(){
  localStorage.setItem("fresh40_ci",ci);

}
function renderC(){
  if(!document.getElementById("cp")) return;
  const x=CQS[ci];

  cp.textContent=x[0];
  cq.textContent="请选择最自然、最正确的表达。";

    d.className=cl;
