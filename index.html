<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HSK 5 · 3.0 模拟考试 02 · 词汇强化版</title>
  <style>
:root{--bg:#eef2f6;--paper:#fff;--ink:#1d2835;--muted:#6d7885;--line:#d9e0e7;--brand:#1769aa;--brand2:#0f4f82;--ok:#2f8f5b;--warn:#e6a019;--danger:#b83a3a;--font:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;color:var(--ink);font-size:var(--font)}button,input,textarea{font:inherit}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:48px;height:48px;background:var(--brand);color:#fff;border-radius:8px;display:grid;place-items:center;font-weight:800}.brand strong,.brand span{display:block}.brand span{font-size:12px;color:var(--muted);margin-top:2px}.top-actions{display:flex;gap:10px;align-items:center}.timer{font-variant-numeric:tabular-nums;font-weight:800;background:#f3f7fa;border:1px solid var(--line);padding:10px 16px;border-radius:7px;min-width:112px;text-align:center}.icon-btn,.ghost-btn,.flag-btn,.nav-btn{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:7px;cursor:pointer}.danger-btn{background:var(--danger);border:0;color:#fff;padding:10px 18px;border-radius:7px;cursor:pointer}.section-tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);padding-left:28px}.section-tab{padding:14px 26px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}.section-tab.active{color:var(--brand);border-bottom-color:var(--brand)}.exam-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;max-width:1400px;margin:20px auto;padding:0 20px}.sidebar,.paper{background:#fff;border:1px solid var(--line);border-radius:10px}.sidebar{padding:18px;height:calc(100vh - 140px);position:sticky;top:132px;overflow:auto}.candidate-card{display:flex;gap:10px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#eaf3fb;color:var(--brand);font-weight:800}.candidate-card span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:14px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.dot.answered{background:var(--ok)}.dot.current{background:var(--brand)}.dot.blank{background:#cbd3db}.question-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.qbtn{height:38px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;color:var(--muted);position:relative}.qbtn.answered{background:#eaf7f0;border-color:#b9dfca;color:#226942}.qbtn.current{outline:3px solid #cfe6f8;border-color:var(--brand);color:var(--brand);font-weight:800}.qbtn.flagged:after{content:"";position:absolute;right:3px;top:3px;width:7px;height:7px;background:var(--warn);border-radius:50%}.full{width:100%}.sidebar .full{margin-top:16px}.paper{min-height:calc(100vh - 140px);padding:30px 42px;display:flex;flex-direction:column}.paper-head{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px}.paper h1{font-size:1.35em;margin:6px 0 0}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:800}.flag-btn.active{background:#fff7dc;border-color:#e8c468;color:#8d6712}.passage{background:#f7f9fb;border-left:4px solid var(--brand);padding:18px 20px;line-height:1.9;margin:22px 0}.question-body{line-height:1.85;margin:26px 0 16px;white-space:pre-wrap}.options{display:grid;gap:12px;max-width:900px}.option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;transition:.12s}.option:hover{border-color:#90bfe3;background:#f8fbfe}.option.selected{border-color:var(--brand);background:#edf6fd}.option-letter{font-weight:800;min-width:24px;color:var(--brand)}.nav-footer{margin-top:auto;padding-top:30px;display:flex;align-items:center;justify-content:space-between}.nav-btn.primary,.primary-btn{background:var(--brand);color:#fff;border-color:var(--brand)}.nav-btn:disabled{opacity:.4;cursor:not-allowed}.audio-area{background:#f0f6fb;border:1px solid #cbddec;border-radius:8px;padding:14px 16px;margin-top:20px;display:flex;align-items:center;gap:12px}.audio-play{border:0;background:var(--brand2);color:#fff;border-radius:6px;padding:10px 15px;cursor:pointer}.audio-play:disabled{opacity:.45}.audio-note{font-size:13px;color:var(--muted)}.writing-box{width:100%;min-height:330px;border:1px solid var(--line);border-radius:8px;padding:18px;resize:vertical;line-height:1.8;outline:none}.writing-box:focus{border-color:var(--brand);box-shadow:0 0 0 3px #dceefa}.counter{text-align:right;color:var(--muted);font-size:13px;margin-top:8px}.speaking-card{border:1px solid var(--line);border-radius:8px;padding:20px}.record-controls{display:flex;gap:10px;align-items:center;margin-top:16px}.record-btn{border:0;background:var(--danger);color:#fff;padding:10px 15px;border-radius:6px;cursor:pointer}.record-btn.stop{background:#333}.record-time{font-variant-numeric:tabular-nums;font-weight:800}.download-link{display:inline-block;margin-top:12px;color:var(--brand)}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:rgba(17,28,39,.62);z-index:50;display:none;place-items:center;padding:20px}.overlay.show{display:grid}.modal{background:#fff;border-radius:12px;box-shadow:0 25px 60px rgba(0,0,0,.25);padding:32px;max-width:620px;width:100%;max-height:90vh;overflow:auto}.start-modal{text-align:center}.modal-badge{display:inline-block;color:var(--brand);background:#eaf3fb;padding:6px 10px;border-radius:999px;font-weight:800;font-size:13px}.start-modal h2{font-size:30px;margin:12px 0}.start-modal p{color:var(--muted);line-height:1.6}.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0;text-align:left}.rules div{border:1px solid var(--line);border-radius:8px;padding:12px}.rules strong,.rules span{display:block}.rules span{color:var(--muted);font-size:13px;margin-top:3px}.checkline{display:flex;gap:8px;align-items:center;justify-content:center;margin:18px 0}.primary-btn{border:0;padding:12px 18px;border-radius:7px;cursor:pointer}.small-note{font-size:12px!important}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.score-card{background:#f6f8fa;border-radius:8px;padding:16px;text-align:center}.score-card strong{display:block;font-size:25px}.score-card span{font-size:12px;color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}@media(max-width:900px){.exam-layout{grid-template-columns:1fr}.sidebar{position:static;height:auto}.topbar{padding:0 12px}.brand span{display:none}.paper{padding:22px}.section-tabs{overflow:auto;padding-left:10px}.section-tab{white-space:nowrap;padding:12px 16px}.question-grid{grid-template-columns:repeat(10,1fr)}}

</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">HSK</div>
        <div><strong>HSK 五级 · 模拟考试 02 · 词汇强化版</strong><span>Computer Based Test</span></div>
      </div>
      <div class="top-actions">
        <button id="fontDown" class="icon-btn" title="缩小字号">A−</button>
        <button id="fontUp" class="icon-btn" title="放大字号">A+</button>
        <div class="timer" id="timer">01:50:00</div>
        <button id="submitBtn" class="danger-btn">交卷</button>
      </div>
    </header>

    <div class="section-tabs" id="sectionTabs"></div>

    <main class="exam-layout">
      <aside class="sidebar">
        <div class="candidate-card">
          <div class="avatar">考</div>
          <div><strong>模拟考生</strong><span id="progressText">0 / 72 已答</span></div>
        </div>
        <div class="legend">
          <span><i class="dot answered"></i>已答</span>
          <span><i class="dot current"></i>当前</span>
          <span><i class="dot blank"></i>未答</span>
        </div>
        <div id="questionGrid" class="question-grid"></div>
        <button id="resetBtn" class="ghost-btn full">清除本地进度</button>
      </aside>

      <section class="paper">
        <div class="paper-head">
          <div>
            <div id="partLabel" class="eyebrow"></div>
            <h1 id="questionTitle"></h1>
          </div>
          <button id="flagBtn" class="flag-btn">☆ 标记</button>
        </div>
        <div id="audioArea" class="audio-area hidden"></div>
        <div id="passage" class="passage hidden"></div>
        <div id="questionBody" class="question-body"></div>
        <div id="options" class="options"></div>
        <div id="writingArea" class="hidden"></div>
        <div id="speakingArea" class="hidden"></div>

        <footer class="nav-footer">
          <button id="prevBtn" class="nav-btn">← 上一题</button>
          <span id="navStatus"></span>
          <button id="nextBtn" class="nav-btn primary">下一题 →</button>
        </footer>
      </section>
    </main>
  </div>

  <div id="startOverlay" class="overlay show">
    <div class="modal start-modal">
      <div class="modal-badge">HSK 5 · 3.0</div>
      <h2>模拟考试 02 · 词汇强化版</h2>
      <p>本网页会保存你的选择和作文到当前浏览器。正式模拟时建议使用电脑、全屏并关闭其他网页。</p>
      <div class="rules">
        <div><strong>听力</strong><span>35 题 · 约 25 分钟</span></div>
        <div><strong>阅读</strong><span>35 题 · 35 分钟</span></div>
        <div><strong>写作</strong><span>2 题 · 40 分钟</span></div>
        <div><strong>口语</strong><span>独立练习 · 可录音</span></div>
      </div>
      <label class="checkline"><input type="checkbox" id="strictMode" checked /> 听力练习每题只允许播放一次</label>
      <button id="startBtn" class="primary-btn full">开始考试</button>
      <p class="small-note">没有 MP3 也能使用浏览器中文语音进行练习；后续可把真人录音放进 audio 文件夹。</p>
    </div>
  </div>

  <div id="resultOverlay" class="overlay">
    <div class="modal result-modal">
      <h2>考试结果</h2>
      <div id="resultContent"></div>
      <div class="modal-actions">
        <button id="closeResult" class="ghost-btn">返回检查</button>
        <button id="downloadResult" class="primary-btn">下载答题记录</button>
      </div>
    </div>
  </div>

  <script>
window.EXAM_DATA = {"answerKey":{"1":"B","2":"C","3":"B","4":"B","5":"C","6":"C","7":"B","8":"C","9":"C","10":"C","11":"B","12":"B","13":"B","14":"C","15":"B","16":"B","17":"B","18":"C","19":"B","20":"B","21":"A","22":"B","23":"B","24":"A","25":"D","26":"B","27":"B","28":"B","29":"B","30":"A","31":"B","32":"B","33":"B","34":"A","35":"A","36":"A","37":"B","38":"A","39":"A","40":"A","41":"A","42":"A","43":"A","44":"A","45":"A","46":"B","47":"C","48":"B","49":"C","50":"C","51":"B","52":"B","53":"B","54":"C","55":"C","56":"B","57":"B","58":"C","59":"B","60":"A","61":"C","62":"A","63":"B","64":"B","65":"B","66":"B","67":"A","68":"B","69":"C","70":"B"},"sections":[{"id":"listening","label":"听力","range":[1,35]},{"id":"reading","label":"阅读","range":[36,70]},{"id":"writing","label":"写作","range":[71,72]},{"id":"speaking","label":"口语","range":[73,77]}],"questions":[{"id":1,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"女的为什么不能早点走？","options":{"A":"要见客户","B":"需要重新核对数据","C":"忘了带方案","D":"准备开会"},"audioText":"男：你不是说今天要早点走吗？\n女：本来是啊，可客户临时把方案改了，我得先把数据重新核对一遍。\n男：那你大概几点能走？\n女：顺利的话，七点以前吧。\n问：女的为什么不能早点走？"},{"id":2,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"男的主要担心什么？","options":{"A":"菜不够新鲜","B":"价格太高","C":"等候时间太长","D":"服务态度不好"},"audioText":"女：这家店评价挺高的，要不要进去看看？\n男：先别急，我看评论里好多人都说周末排队至少一个小时。\n女：那算了，我们去旁边那家吧。\n问：男的主要担心什么？"},{"id":3,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"女的骑车上班主要是为了什么？","options":{"A":"节省交通费","B":"锻炼身体","C":"避开地铁高峰","D":"保护环境"},"audioText":"男：你最近怎么总骑车上班？\n女：地铁当然方便，不过我整天坐办公室，骑车正好活动一下。\n男：天气冷了你还坚持？\n女：看情况吧，下雨肯定不骑。\n问：女的骑车上班主要是为了什么？"},{"id":4,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"女的建议男的怎么修改报告？","options":{"A":"删掉结论","B":"增加分析例子","C":"缩短报告","D":"改变研究主题"},"audioText":"女：报告我看过了，整体没问题，就是结论这一段有点突然。\n男：是不是前面的分析还不够充分？\n女：对，你最好再补两个例子，让前后更有联系。\n问：女的建议男的怎么修改报告？"},{"id":5,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"女的为什么拒绝那家公司？","options":{"A":"工资太低","B":"距离太远","C":"发展方向不合适","D":"工作时间太长"},"audioText":"男：听说你拒绝了那家公司的邀请？条件不是挺好吗？\n女：待遇确实不错，不过工作内容和我长期想发展的方向不太一致。\n问：女的为什么拒绝那家公司？"},{"id":6,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"他们准备怎么解决场地问题？","options":{"A":"取消活动","B":"换到室外","C":"增加线上直播","D":"推迟报名"},"audioText":"女：这个活动报名的人比预计多了一倍，场地恐怕坐不下。\n男：要不把线下人数控制一下，再同步做直播？\n女：我觉得可以，这样也不至于让已经报名的人失望。\n问：他们准备怎么解决场地问题？"},{"id":7,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"女的为什么移动花盆？","options":{"A":"方便浇水","B":"增加光照","C":"避免碰坏","D":"房间太挤"},"audioText":"男：你怎么把那盆花搬到窗边了？\n女：它最近叶子一直发黄，我查了一下，可能是光照不够。\n男：那先观察几天吧。\n问：女的为什么移动花盆？"},{"id":8,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"男的演讲为什么表现得比较好？","options":{"A":"经验特别丰富","B":"观众人数少","C":"准备得比较充分","D":"演讲内容很简单"},"audioText":"女：你昨天的演讲挺顺的，一点儿都看不出紧张。\n男：其实上台前手都凉了。好在我提前练了很多遍，开口以后就慢慢放松了。\n问：男的演讲为什么表现得比较好？"},{"id":9,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"女的为什么选择高铁？","options":{"A":"价格更便宜","B":"行李比较多","C":"担心天气影响航班","D":"高铁时间更短"},"audioText":"男：这次出差你订高铁还是飞机？\n女：飞机快是快，可最近那边天气不稳定，我还是坐高铁稳妥一点。\n问：女的为什么选择高铁？"},{"id":10,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"男的如何评价新经理？","options":{"A":"能力一般","B":"比较固执","C":"严格但愿意听意见","D":"工作效率很低"},"audioText":"女：你们新来的经理怎么样？\n男：要求挺高，不过遇到问题他会先听大家的意见，不会一上来就否定。\n女：那还不错。\n问：男的如何评价新经理？"},{"id":11,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"女的是什么意思？","options":{"A":"今天必须签合同","B":"应该先确认细节","C":"合同已经无效","D":"法律顾问不同意合作"},"audioText":"男：这份合同今天一定要签吗？\n女：不急。法律顾问还有两个细节没确认，等他回复以后再签更保险。\n问：女的是什么意思？"},{"id":12,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"男的目前怎么打算？","options":{"A":"马上买新房","B":"暂时不换房","C":"搬到郊区","D":"增加贷款"},"audioText":"女：你不是一直想换个大一点儿的房子吗？\n男：是，不过算了算贷款，压力有点儿大。现在这个虽然小，位置倒挺方便。\n问：男的目前怎么打算？"},{"id":13,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"女的认为广告有什么问题？","options":{"A":"画面不好看","B":"主题不够明确","C":"内容太少","D":"没有价格信息"},"audioText":"男：你觉得这个广告怎么样？\n女：画面挺漂亮，就是信息太多，我看了半天还没明白它到底想强调什么。\n问：女的认为广告有什么问题？"},{"id":14,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"男的为什么暂停训练？","options":{"A":"比赛取消了","B":"工作太忙","C":"身体不舒服","D":"缺少训练场地"},"audioText":"女：你不是准备参加下个月的比赛吗？最近怎么没去训练？\n男：膝盖有点儿不舒服，医生说最好先休息几天，别勉强。\n问：男的为什么暂停训练？"},{"id":15,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"女的建议男的做什么？","options":{"A":"重新制作表格","B":"发PDF版本","C":"删除最后一页","D":"换一个群"},"audioText":"男：我把那份材料发群里了，你看见了吗？\n女：看见了。不过最后一页的表格在手机上显示不全，你最好再发个PDF版本。\n问：女的建议男的做什么？"},{"id":16,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"男的提醒女的注意什么？","options":{"A":"数据计算错误","B":"样本不够有代表性","C":"调查时间太短","D":"年轻用户不愿回答"},"audioText":"女：这次调查结果跟我们之前的判断不太一样。\n男：先别急着下结论，样本主要来自年轻用户，代表性可能有限。\n问：男的提醒女的注意什么？"},{"id":17,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"女的为什么选择星期五下午开会？","options":{"A":"会议室只有那时空","B":"多数人时间合适","C":"领导要求如此","D":"可以提前下班"},"audioText":"男：你怎么把会议安排到星期五下午？大家不是都挺忙的吗？\n女：我问过一圈了，反而这个时间冲突最少，而且重要的人都能参加。\n问：女的为什么选择星期五下午开会？"},{"id":18,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"男的最后没买外套的原因是什么？","options":{"A":"尺码不合适","B":"价格太贵","C":"已有类似衣服","D":"颜色不喜欢"},"audioText":"女：这件外套你不是很喜欢吗，怎么又放回去了？\n男：款式是不错，可我已经有两件差不多的了。想想还是没必要买。\n问：男的最后没买外套的原因是什么？"},{"id":19,"type":"mcq","section":"listening","part":"听力 · 第一部分","prompt":"女的态度是什么？","options":{"A":"马上安排加班","B":"先分析进度延误原因","C":"减少项目内容","D":"暂停项目"},"audioText":"男：项目进度比计划慢了三天，要不要让大家周末加班？\n女：先看看问题到底出在哪儿。如果只是流程安排不合理，加班也未必能解决。\n问：女的态度是什么？"},{"id":20,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"最初有人主要担心什么？","options":{"A":"工具价格上涨","B":"工具容易丢失或损坏","C":"居民不会使用工具","D":"登记手续太复杂"},"audioText":"近几年，一些社区开始设置“共享工具柜”，居民可以借用电钻、梯子、维修箱等不常使用但偶尔需要的工具。刚开始，有人担心工具容易丢失或损坏，因此管理方要求实名登记，并规定归还时间。运行半年后，真正丢失的情况很少，反而有不少居民因为借还工具认识了邻居。负责人认为，这个项目节省的不只是购买工具的钱，更重要的是提高了社区资源的利用率，也增加了人与人之间的联系。\n问：最初有人主要担心什么？"},{"id":21,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"管理方采取了什么办法？","options":{"A":"要求实名登记","B":"限制老年人借用","C":"只在周末开放","D":"收取高额押金"},"audioText":"近几年，一些社区开始设置“共享工具柜”，居民可以借用电钻、梯子、维修箱等不常使用但偶尔需要的工具。刚开始，有人担心工具容易丢失或损坏，因此管理方要求实名登记，并规定归还时间。运行半年后，真正丢失的情况很少，反而有不少居民因为借还工具认识了邻居。负责人认为，这个项目节省的不只是购买工具的钱，更重要的是提高了社区资源的利用率，也增加了人与人之间的联系。\n问：管理方采取了什么办法？"},{"id":22,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"项目运行后还带来了什么变化？","options":{"A":"居民搬家更频繁","B":"邻里联系增加","C":"工具种类减少","D":"维修费用上升"},"audioText":"近几年，一些社区开始设置“共享工具柜”，居民可以借用电钻、梯子、维修箱等不常使用但偶尔需要的工具。刚开始，有人担心工具容易丢失或损坏，因此管理方要求实名登记，并规定归还时间。运行半年后，真正丢失的情况很少，反而有不少居民因为借还工具认识了邻居。负责人认为，这个项目节省的不只是购买工具的钱，更重要的是提高了社区资源的利用率，也增加了人与人之间的联系。\n问：项目运行后还带来了什么变化？"},{"id":23,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"负责人最强调这个项目的什么价值？","options":{"A":"让居民买更多工具","B":"提高资源利用率并促进交流","C":"减少社区工作人员","D":"替代专业维修服务"},"audioText":"近几年，一些社区开始设置“共享工具柜”，居民可以借用电钻、梯子、维修箱等不常使用但偶尔需要的工具。刚开始，有人担心工具容易丢失或损坏，因此管理方要求实名登记，并规定归还时间。运行半年后，真正丢失的情况很少，反而有不少居民因为借还工具认识了邻居。负责人认为，这个项目节省的不只是购买工具的钱，更重要的是提高了社区资源的利用率，也增加了人与人之间的联系。\n问：负责人最强调这个项目的什么价值？"},{"id":24,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"出版社为什么进行读者访谈？","options":{"A":"了解读不完书的原因","B":"决定提高书价","C":"寻找新的作者","D":"推广电子书"},"audioText":"一家出版社发现，读者买书后真正读完的比例并不高。为了了解原因，他们邀请读者参加访谈。有人说工作忙，长时间阅读很难坚持；也有人表示，不知道该从哪里开始，常常买了很多却没有阅读计划。于是出版社推出“二十分钟阅读计划”：每天只安排二十分钟，并在应用里提供进度记录和简短提示。三个月后，参与者的平均阅读完成率明显提高。研究人员提醒，计划有效并不是因为二十分钟这个数字本身，而是因为目标足够具体，也比较容易长期坚持。\n问：出版社为什么进行读者访谈？"},{"id":25,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"读者没有读完书的原因不包括哪项？","options":{"A":"工作忙","B":"缺少阅读计划","C":"不知道从哪里开始","D":"书的价格太高"},"audioText":"一家出版社发现，读者买书后真正读完的比例并不高。为了了解原因，他们邀请读者参加访谈。有人说工作忙，长时间阅读很难坚持；也有人表示，不知道该从哪里开始，常常买了很多却没有阅读计划。于是出版社推出“二十分钟阅读计划”：每天只安排二十分钟，并在应用里提供进度记录和简短提示。三个月后，参与者的平均阅读完成率明显提高。研究人员提醒，计划有效并不是因为二十分钟这个数字本身，而是因为目标足够具体，也比较容易长期坚持。\n问：读者没有读完书的原因不包括哪项？"},{"id":26,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"“二十分钟阅读计划”有什么特点？","options":{"A":"要求一次读完一本书","B":"目标具体且容易坚持","C":"只适合学生","D":"必须在早上进行"},"audioText":"一家出版社发现，读者买书后真正读完的比例并不高。为了了解原因，他们邀请读者参加访谈。有人说工作忙，长时间阅读很难坚持；也有人表示，不知道该从哪里开始，常常买了很多却没有阅读计划。于是出版社推出“二十分钟阅读计划”：每天只安排二十分钟，并在应用里提供进度记录和简短提示。三个月后，参与者的平均阅读完成率明显提高。研究人员提醒，计划有效并不是因为二十分钟这个数字本身，而是因为目标足够具体，也比较容易长期坚持。\n问：“二十分钟阅读计划”有什么特点？"},{"id":27,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"研究人员认为计划有效的关键是什么？","options":{"A":"阅读时间越长越好","B":"目标明确且可持续","C":"应用功能复杂","D":"读者买书更多"},"audioText":"一家出版社发现，读者买书后真正读完的比例并不高。为了了解原因，他们邀请读者参加访谈。有人说工作忙，长时间阅读很难坚持；也有人表示，不知道该从哪里开始，常常买了很多却没有阅读计划。于是出版社推出“二十分钟阅读计划”：每天只安排二十分钟，并在应用里提供进度记录和简短提示。三个月后，参与者的平均阅读完成率明显提高。研究人员提醒，计划有效并不是因为二十分钟这个数字本身，而是因为目标足够具体，也比较容易长期坚持。\n问：研究人员认为计划有效的关键是什么？"},{"id":28,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"学生一开始怎么看校园菜园？","options":{"A":"非常感兴趣","B":"觉得与学习关系不大","C":"认为面积太小","D":"担心蔬菜卖不出去"},"audioText":"一所中学把部分校园空地改成了小型菜园，由不同班级轮流负责。开始时，一些学生觉得种菜和学习没有关系，只把它当成额外任务。后来老师把生物、数学甚至语文课的一部分内容放进菜园：学生观察植物生长，记录数据，计算面积，还写观察日记。一个学期后，很多学生开始主动讨论怎样改善土壤、减少虫害。老师说，菜园的目的并不是培养农民，而是让学生在真实环境中理解知识之间的联系。\n问：学生一开始怎么看校园菜园？"},{"id":29,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"老师后来怎么利用菜园？","options":{"A":"只上生物课","B":"把多门学科内容结合进去","C":"让家长负责管理","D":"作为体育场地"},"audioText":"一所中学把部分校园空地改成了小型菜园，由不同班级轮流负责。开始时，一些学生觉得种菜和学习没有关系，只把它当成额外任务。后来老师把生物、数学甚至语文课的一部分内容放进菜园：学生观察植物生长，记录数据，计算面积，还写观察日记。一个学期后，很多学生开始主动讨论怎样改善土壤、减少虫害。老师说，菜园的目的并不是培养农民，而是让学生在真实环境中理解知识之间的联系。\n问：老师后来怎么利用菜园？"},{"id":30,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"一个学期后学生有什么变化？","options":{"A":"开始主动思考实际问题","B":"不再记录数据","C":"要求取消菜园","D":"只关心收成"},"audioText":"一所中学把部分校园空地改成了小型菜园，由不同班级轮流负责。开始时，一些学生觉得种菜和学习没有关系，只把它当成额外任务。后来老师把生物、数学甚至语文课的一部分内容放进菜园：学生观察植物生长，记录数据，计算面积，还写观察日记。一个学期后，很多学生开始主动讨论怎样改善土壤、减少虫害。老师说，菜园的目的并不是培养农民，而是让学生在真实环境中理解知识之间的联系。\n问：一个学期后学生有什么变化？"},{"id":31,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"老师认为菜园最重要的作用是什么？","options":{"A":"提高学校收入","B":"帮助理解知识之间的联系","C":"学习专业农业技术","D":"减少课堂时间"},"audioText":"一所中学把部分校园空地改成了小型菜园，由不同班级轮流负责。开始时，一些学生觉得种菜和学习没有关系，只把它当成额外任务。后来老师把生物、数学甚至语文课的一部分内容放进菜园：学生观察植物生长，记录数据，计算面积，还写观察日记。一个学期后，很多学生开始主动讨论怎样改善土壤、减少虫害。老师说，菜园的目的并不是培养农民，而是让学生在真实环境中理解知识之间的联系。\n问：老师认为菜园最重要的作用是什么？"},{"id":32,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"研究发现，长期运动者不一定具有什么？","options":{"A":"稳定的时间","B":"更强的意志力","C":"合适的环境","D":"固定的伙伴"},"audioText":"研究人员观察了一批长期坚持运动的人，发现他们并不总是比别人更有“意志力”。很多人只是把运动安排得更容易执行：有人把运动鞋放在门口，有人固定和朋友约同一时间跑步，还有人选择离家很近的健身房。研究者认为，当一个行为需要反复依靠临时决定时，人更容易放弃；相反，如果环境本身能提醒和推动行动，坚持就会轻松得多。因此，建立习惯时，与其不断要求自己“更自律”，不如先减少行动中的阻力。\n问：研究发现，长期运动者不一定具有什么？"},{"id":33,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"文中哪项属于“减少行动阻力”？","options":{"A":"临时决定运动时间","B":"选择离家近的健身房","C":"每天改变运动项目","D":"只在有动力时运动"},"audioText":"研究人员观察了一批长期坚持运动的人，发现他们并不总是比别人更有“意志力”。很多人只是把运动安排得更容易执行：有人把运动鞋放在门口，有人固定和朋友约同一时间跑步，还有人选择离家很近的健身房。研究者认为，当一个行为需要反复依靠临时决定时，人更容易放弃；相反，如果环境本身能提醒和推动行动，坚持就会轻松得多。因此，建立习惯时，与其不断要求自己“更自律”，不如先减少行动中的阻力。\n问：文中哪项属于“减少行动阻力”？"},{"id":34,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"为什么反复依靠临时决定容易放弃？","options":{"A":"决定过程本身增加了行动难度","B":"运动对身体不好","C":"朋友会反对","D":"环境没有变化"},"audioText":"研究人员观察了一批长期坚持运动的人，发现他们并不总是比别人更有“意志力”。很多人只是把运动安排得更容易执行：有人把运动鞋放在门口，有人固定和朋友约同一时间跑步，还有人选择离家很近的健身房。研究者认为，当一个行为需要反复依靠临时决定时，人更容易放弃；相反，如果环境本身能提醒和推动行动，坚持就会轻松得多。因此，建立习惯时，与其不断要求自己“更自律”，不如先减少行动中的阻力。\n问：为什么反复依靠临时决定容易放弃？"},{"id":35,"type":"mcq","section":"listening","part":"听力 · 第二部分","prompt":"这段话主要说明什么？","options":{"A":"培养习惯应设计好环境","B":"运动必须依靠意志力","C":"健身房越远越好","D":"自律的人不需要计划"},"audioText":"研究人员观察了一批长期坚持运动的人，发现他们并不总是比别人更有“意志力”。很多人只是把运动安排得更容易执行：有人把运动鞋放在门口，有人固定和朋友约同一时间跑步，还有人选择离家很近的健身房。研究者认为，当一个行为需要反复依靠临时决定时，人更容易放弃；相反，如果环境本身能提醒和推动行动，坚持就会轻松得多。因此，建立习惯时，与其不断要求自己“更自律”，不如先减少行动中的阻力。\n问：这段话主要说明什么？"},{"id":36,"type":"mcq","section":"reading","part":"阅读 · 第一部分","prompt":"双方虽然在细节上还有分歧，但合作的大方向已经基本____。","options":{"A":"确定","B":"承担","C":"取消","D":"适应"}},{"id":37,"type":"mcq","section":"reading","part":"阅读 · 第一部分","prompt":"面对网上复杂的信息，我们需要保持判断力，不能轻易被表面现象所____。","options":{"A":"补充","B":"迷惑","C":"恢复","D":"发表"}},{"id":38,"type":"mcq","section":"reading","part":"阅读 · 第一部分","prompt":"这个方案最大的优点是充分____了不同年龄用户的实际需求。","options":{"A":"考虑","B":"拒绝","C":"产生","D":"消失"}},{"id":39,"type":"mcq","section":"reading","part":"阅读 · 第一部分","prompt":"公司决定暂时不扩大规模，而是先把现有流程进一步____。","options":{"A":"改善","B":"召开","C":"纪念","D":"构成"}},{"id":40,"type":"mcq","section":"reading","part":"阅读 · 第一部分","prompt":"由于准备得比较____，即使现场出现意外，他们也很快调整了安排。","options":{"A":"充分","B":"陌生","C":"有限","D":"偶然"}},{"id":41,"type":"mcq","section":"reading","part":"阅读 · 第一部分","prompt":"调查结果只能____一部分消费者的看法，不能代表所有人。","options":{"A":"反映","B":"维持","C":"避免","D":"成立"}},{"id":42,"type":"mcq","section":"reading","part":"阅读 · 第一部分","prompt":"与其不断增加任务，不如先分清轻重缓急，合理____时间。","options":{"A":"安排","B":"承担","C":"交换","D":"承认"}},{"id":43,"type":"mcq","section":"reading","part":"阅读 · 第一部分","prompt":"他的解释听起来有道理，不过目前还缺少足够的证据来____这个判断。","options":{"A":"证实","B":"接待","C":"提醒","D":"欣赏"}},{"id":44,"type":"mcq","section":"reading","part":"阅读 · 第一部分","prompt":"新员工需要一段时间才能____公司的工作节奏和沟通方式。","options":{"A":"适应","B":"包含","C":"违反","D":"集中"}},{"id":45,"type":"mcq","section":"reading","part":"阅读 · 第一部分","prompt":"这次活动能顺利完成，是大家互相____、及时沟通的结果。","options":{"A":"配合","B":"限制","C":"怀疑","D":"推迟"}},{"id":46,"type":"mcq","section":"reading","part":"阅读 · 第二部分","prompt":"根据这段话，下列哪项正确？","options":{"A":"信息越多决定一定越好","B":"做决定前应先明确关键条件","C":"搜集资料会降低效率","D":"重要决定不需要信息"},"passage":"一些人习惯在做决定前搜集大量资料，以为信息越多越保险。但信息过多也可能让人难以判断重点。真正有效的做法，是先明确自己最关心的条件，再有针对性地寻找资料。"},{"id":47,"type":"mcq","section":"reading","part":"阅读 · 第二部分","prompt":"商店提高满意度的主要办法是什么？","options":{"A":"增加促销","B":"降低价格","C":"简化服务流程","D":"更换商品"},"passage":"一家商店发现，顾客抱怨最多的并不是商品质量，而是退换货流程太复杂。于是商店没有增加促销，而是重新设计了服务流程。两个月后，顾客满意度明显提高。"},{"id":48,"type":"mcq","section":"reading","part":"阅读 · 第二部分","prompt":"采访者为什么会短暂停顿？","options":{"A":"忘了下一个问题","B":"给对方补充信息的机会","C":"控制采访时间","D":"避免记录内容"},"passage":"有经验的采访者很少连续提出很多问题。他们往往会在对方回答后稍微停一下，因为短暂的沉默有时能让对方补充更真实、更重要的信息。"},{"id":49,"type":"mcq","section":"reading","part":"阅读 · 第二部分","prompt":"这段话主要说明什么？","options":{"A":"创造力完全靠天赋","B":"灵感和积累没有关系","C":"丰富积累有助于产生新想法","D":"只研究一个领域最容易创新"},"passage":"很多人以为创造力只来自突然出现的灵感。实际上，好的想法往往建立在长期积累之上。一个人接触的领域越丰富，越可能把原本没有关系的信息重新组合。"},{"id":50,"type":"mcq","section":"reading","part":"阅读 · 第二部分","prompt":"城市最终采取了什么态度？","options":{"A":"立即全面推广","B":"完全取消计划","C":"先试行再评估","D":"只听反对意见"},"passage":"某城市把部分停车位改成临时休息区，引起了争议。支持者认为公共空间不应只服务汽车，反对者则担心停车更困难。城市最终决定先在几个街区试行，再根据数据调整。"},{"id":51,"type":"mcq","section":"reading","part":"阅读 · 第二部分","prompt":"有效反馈最重要的特点是什么？","options":{"A":"情绪强烈","B":"内容具体并可行动","C":"只谈结果","D":"越简短越好"},"passage":"真正有效的反馈通常包含三个部分：具体发生了什么、造成了什么影响、下一步可以怎样改进。如果只评价一个人“好”或“不好”，往往很难帮助他采取行动。"},{"id":52,"type":"mcq","section":"reading","part":"阅读 · 第二部分","prompt":"企业复盘的主要目的是什么？","options":{"A":"追究个人责任","B":"总结经验改善决策","C":"证明领导正确","D":"延长项目时间"},"passage":"一些企业鼓励员工在项目结束后做复盘，但复盘的目的并不是寻找“谁犯了错”，而是弄清楚哪些判断当时合理、哪些信息被忽略，从而让下一次决策更可靠。"},{"id":53,"type":"mcq","section":"reading","part":"阅读 · 第二部分","prompt":"根据这段话，下列哪项正确？","options":{"A":"阅读好就一定口语好","B":"真实交流有助于提升表达能力","C":"表达速度比准确性更重要","D":"语言学习只需要输入"},"passage":"学习一门语言时，理解别人说什么和自己能自然表达是两种不同能力。因此，即使阅读水平不错，也需要通过真实交流不断训练表达速度和准确性。"},{"id":54,"type":"mcq","section":"reading","part":"阅读 · 第二部分","prompt":"这种参观方式有什么效果？","options":{"A":"所有人看到相同内容","B":"参观时间缩短","C":"参与感提高","D":"路线更固定"},"passage":"有的博物馆不再要求参观者按照固定路线前进，而是提供几个主题入口。参观者可以根据兴趣选择路径。研究发现，这种方式虽然让每个人看到的内容不同，却提高了停留时间和参与感。"},{"id":55,"type":"mcq","section":"reading","part":"阅读 · 第二部分","prompt":"这种做法主要是为了什么？","options":{"A":"加快形成一致意见","B":"减少成员数量","C":"发现可能被忽略的问题","D":"证明原方案错误"},"passage":"当一个团队对某个方案过早形成一致意见时，成员可能不愿再提出不同看法。为了避免这种情况，有的团队会专门安排一名成员从反面寻找问题。"},{"id":56,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"过去的保护工作更关注什么？","options":{"A":"普通住宅","B":"著名建筑和重大事件","C":"街角小店","D":"市场价格"},"passage":"城市里有些老建筑看起来并不起眼，却记录着普通人的生活方式。过去，保护工作往往更关注著名建筑和重大历史事件。近些年，一些研究者开始调查老市场、工人住宅和街角小店，因为这些地方能反映一个城市如何成长。保护它们并不意味着全部保持原样，而是在改造时保留重要的空间结构、材料或记忆。这样，建筑才能继续被使用，同时又不完全失去原来的身份。"},{"id":57,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"研究者为什么开始关注老市场等地方？","options":{"A":"它们更容易赚钱","B":"它们反映城市成长过程","C":"它们面积更大","D":"它们不需要改造"},"passage":"城市里有些老建筑看起来并不起眼，却记录着普通人的生活方式。过去，保护工作往往更关注著名建筑和重大历史事件。近些年，一些研究者开始调查老市场、工人住宅和街角小店，因为这些地方能反映一个城市如何成长。保护它们并不意味着全部保持原样，而是在改造时保留重要的空间结构、材料或记忆。这样，建筑才能继续被使用，同时又不完全失去原来的身份。"},{"id":58,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"作者如何看待“保护”？","options":{"A":"必须完全保持原样","B":"应停止使用老建筑","C":"可在继续使用中保留重要记忆","D":"只保留建筑外墙"},"passage":"城市里有些老建筑看起来并不起眼，却记录着普通人的生活方式。过去，保护工作往往更关注著名建筑和重大历史事件。近些年，一些研究者开始调查老市场、工人住宅和街角小店，因为这些地方能反映一个城市如何成长。保护它们并不意味着全部保持原样，而是在改造时保留重要的空间结构、材料或记忆。这样，建筑才能继续被使用，同时又不完全失去原来的身份。"},{"id":59,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"频繁切换任务会带来什么问题？","options":{"A":"增加记忆容量","B":"产生额外的注意力成本","C":"让工作更有趣","D":"减少信息量"},"passage":"很多人工作时喜欢同时开着邮件、聊天软件和多个网页，感觉自己在“同时处理很多事”。但认知研究发现，大脑在复杂任务之间频繁切换会产生额外成本：每次重新进入任务都需要恢复上下文。短时间看，切换似乎只浪费几秒；一天下来，却可能明显降低效率。研究者建议，在需要深入思考的工作中，可以设定一段不被打扰的时间，把通知暂时关闭，再集中处理消息。"},{"id":60,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"为什么短暂切换也可能影响效率？","options":{"A":"每次都要重新恢复任务背景","B":"电脑运行变慢","C":"同事会等待","D":"任务数量增加"},"passage":"很多人工作时喜欢同时开着邮件、聊天软件和多个网页，感觉自己在“同时处理很多事”。但认知研究发现，大脑在复杂任务之间频繁切换会产生额外成本：每次重新进入任务都需要恢复上下文。短时间看，切换似乎只浪费几秒；一天下来，却可能明显降低效率。研究者建议，在需要深入思考的工作中，可以设定一段不被打扰的时间，把通知暂时关闭，再集中处理消息。"},{"id":61,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"研究者建议如何处理需要深入思考的工作？","options":{"A":"一直打开通知","B":"边聊天边工作","C":"安排不被打扰的专注时间","D":"只在晚上工作"},"passage":"很多人工作时喜欢同时开着邮件、聊天软件和多个网页，感觉自己在“同时处理很多事”。但认知研究发现，大脑在复杂任务之间频繁切换会产生额外成本：每次重新进入任务都需要恢复上下文。短时间看，切换似乎只浪费几秒；一天下来，却可能明显降低效率。研究者建议，在需要深入思考的工作中，可以设定一段不被打扰的时间，把通知暂时关闭，再集中处理消息。"},{"id":62,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"第一次测试出现了什么现象？","options":{"A":"评价好但购买意愿不高","B":"消费者完全不喜欢","C":"产品价格太低","D":"没有人参加测试"},"passage":"一家食品企业推出新产品前，先让一小部分消费者试吃。第一次测试中，多数人说“味道不错”，团队很高兴。但负责人注意到，愿意真正购买的人却不多。第二次测试，他们不再只问“喜不喜欢”，而是让消费者在几种产品中做选择，并询问愿意支付的价格。结果显示，新产品虽然评价高，却缺少明显特色。团队因此调整了配方。负责人说，市场研究中，人们说什么很重要，但他们在真实选择中怎么做，有时更值得参考。"},{"id":63,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"第二次测试有什么不同？","options":{"A":"只询问口味","B":"加入了真实选择和价格问题","C":"取消了消费者参与","D":"只比较包装"},"passage":"一家食品企业推出新产品前，先让一小部分消费者试吃。第一次测试中，多数人说“味道不错”，团队很高兴。但负责人注意到，愿意真正购买的人却不多。第二次测试，他们不再只问“喜不喜欢”，而是让消费者在几种产品中做选择，并询问愿意支付的价格。结果显示，新产品虽然评价高，却缺少明显特色。团队因此调整了配方。负责人说，市场研究中，人们说什么很重要，但他们在真实选择中怎么做，有时更值得参考。"},{"id":64,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"负责人最强调什么？","options":{"A":"口头评价永远不可信","B":"真实选择行为也很有参考价值","C":"价格越高越好","D":"消费者不懂产品"},"passage":"一家食品企业推出新产品前，先让一小部分消费者试吃。第一次测试中，多数人说“味道不错”，团队很高兴。但负责人注意到，愿意真正购买的人却不多。第二次测试，他们不再只问“喜不喜欢”，而是让消费者在几种产品中做选择，并询问愿意支付的价格。结果显示，新产品虽然评价高，却缺少明显特色。团队因此调整了配方。负责人说，市场研究中，人们说什么很重要，但他们在真实选择中怎么做，有时更值得参考。"},{"id":65,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"一些种子为什么不会马上发芽？","options":{"A":"因为没有生命","B":"为了等待更合适的环境","C":"因为种子太大","D":"为了避免阳光"},"passage":"在自然界中，很多种子并不会落地后立刻发芽。有些种子需要经历一段低温，有些则要等到雨季到来。这种“等待”并不是浪费时间，而是一种适应环境的策略：如果在不合适的季节发芽，幼苗可能因为缺水或寒冷而死亡。科学家研究种子的休眠机制，不仅是为了理解植物，也希望帮助农业更准确地控制播种和发芽时间。"},{"id":66,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"文中如何评价种子的“等待”？","options":{"A":"没有意义","B":"是一种适应策略","C":"会降低生存率","D":"只发生在冬天"},"passage":"在自然界中，很多种子并不会落地后立刻发芽。有些种子需要经历一段低温，有些则要等到雨季到来。这种“等待”并不是浪费时间，而是一种适应环境的策略：如果在不合适的季节发芽，幼苗可能因为缺水或寒冷而死亡。科学家研究种子的休眠机制，不仅是为了理解植物，也希望帮助农业更准确地控制播种和发芽时间。"},{"id":67,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"研究种子休眠还有什么实际价值？","options":{"A":"帮助控制农业播种和发芽时间","B":"让所有植物同时开花","C":"减少植物种类","D":"替代天气预报"},"passage":"在自然界中，很多种子并不会落地后立刻发芽。有些种子需要经历一段低温，有些则要等到雨季到来。这种“等待”并不是浪费时间，而是一种适应环境的策略：如果在不合适的季节发芽，幼苗可能因为缺水或寒冷而死亡。科学家研究种子的休眠机制，不仅是为了理解植物，也希望帮助农业更准确地控制播种和发芽时间。"},{"id":68,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"规则太多可能产生什么问题？","options":{"A":"成员更有创造力","B":"成员过度依赖流程","C":"风险完全消失","D":"团队规模变小"},"passage":"一个刚成立的团队常常希望尽快建立一套完整规则，但规则太多也可能产生副作用。成员遇到新情况时，如果只想着“流程里有没有写”，就容易失去判断。成熟团队通常会区分两类问题：高风险、重复出现的问题需要明确标准；而变化快、依赖现场信息的问题，则给执行者一定决定空间。规则真正的价值，不是替代人的思考，而是让重要经验可以被稳定地重复。"},{"id":69,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"哪类问题更适合明确标准？","options":{"A":"变化很快的问题","B":"完全没有风险的问题","C":"高风险且重复出现的问题","D":"只出现一次的问题"},"passage":"一个刚成立的团队常常希望尽快建立一套完整规则，但规则太多也可能产生副作用。成员遇到新情况时，如果只想着“流程里有没有写”，就容易失去判断。成熟团队通常会区分两类问题：高风险、重复出现的问题需要明确标准；而变化快、依赖现场信息的问题，则给执行者一定决定空间。规则真正的价值，不是替代人的思考，而是让重要经验可以被稳定地重复。"},{"id":70,"type":"mcq","section":"reading","part":"阅读 · 第三部分","prompt":"作者认为规则真正的价值是什么？","options":{"A":"替代人的判断","B":"让经验可以稳定重复","C":"让所有情况完全一致","D":"减少沟通"},"passage":"一个刚成立的团队常常希望尽快建立一套完整规则，但规则太多也可能产生副作用。成员遇到新情况时，如果只想着“流程里有没有写”，就容易失去判断。成熟团队通常会区分两类问题：高风险、重复出现的问题需要明确标准；而变化快、依赖现场信息的问题，则给执行者一定决定空间。规则真正的价值，不是替代人的思考，而是让重要经验可以被稳定地重复。"},{"id":71,"type":"writing","section":"writing","part":"写作 · 第71题","prompt":"根据情境写作（不少于100字）","passage":"请根据下面的情境写一篇不少于100字的短文：\n你和同学准备一次校园文化活动。开始报名人数很少，大家意见也不一致。后来你们重新调查同学需求、调整宣传方式，并对活动内容做了改进。最终活动顺利举行。请写清楚事情的经过、变化和结果。","minChars":100},{"id":72,"type":"writing","section":"writing","part":"写作 · 第72题","prompt":"话题写作（不少于200字）","passage":"有人认为：“真正的效率，不是把每一分钟都安排满，而是把精力放在最重要的事情上。”请结合自己的学习、工作或生活经历，谈谈你的理解。","minChars":200},{"id":73,"type":"speaking","section":"speaking","part":"口语 · 听后复述","prompt":"第1题：听录音后复述。","audioText":"一位年轻设计师刚参加工作时，总希望自己的方案一次就得到认可。每次被修改，他都会觉得是不是自己能力不够。后来一位前辈告诉他，修改并不一定意味着失败，很多好方案都是在不断讨论中形成的。慢慢地，他开始把意见当成补充信息，而不是对自己的否定。半年以后，他发现自己不仅设计得更快，也更愿意主动和别人交流。"},{"id":74,"type":"speaking","section":"speaking","part":"口语 · 听后复述","prompt":"第2题：听录音后复述。","audioText":"一家咖啡店每天晚上关门前都会剩下一些没有卖完的面包。最初店员只是把它们处理掉。后来经理联系了附近的公益机构，只要食品仍在安全时间内，就会统一包装并在当天送出去。为了减少剩余，他们还根据每天的销售记录调整制作数量。几个月后，浪费明显减少，店员也觉得这件事很有意义。"},{"id":75,"type":"speaking","section":"speaking","part":"口语 · 看图说话","prompt":"第3题：请根据连续画面讲一个完整故事。","passage":"① 一名学生在图书馆发现一本书里夹着一张重要证件。\n② 他根据证件信息联系图书馆工作人员，请工作人员帮助寻找失主。\n③ 失主赶来取回证件并道谢，学生说这只是举手之劳。"},{"id":76,"type":"speaking","section":"speaking","part":"口语 · 回答问题","prompt":"第4题：你认为在学习或工作中，“主动寻求反馈”重要吗？为什么？请结合例子说明。"},{"id":77,"type":"speaking","section":"speaking","part":"口语 · 回答问题","prompt":"第5题：现在很多人利用人工智能工具学习。你认为它能提高学习效率吗？使用时需要注意哪些问题？"}]};

</script>
  <script>
(() => {
const D=window.EXAM_DATA, $=s=>document.querySelector(s);
const state={current:1,answers:{},writing:{},flags:{},played:{},strict:true,started:false,seconds:110*60,font:18,recordings:{}};
const saved=JSON.parse(localStorage.getItem('hsk5_mock02_state')||'null');
if(saved){Object.assign(state,saved);state.recordings={};state.started=false;}
let tick=null, mediaRecorder=null, chunks=[], recordTimer=null, recordSeconds=0;
const save=()=>{const copy={...state,recordings:{}};localStorage.setItem('hsk5_mock02_state',JSON.stringify(copy));};
const qById=id=>D.questions.find(q=>q.id===id);
const sectionFor=id=>D.sections.find(s=>id>=s.range[0]&&id<=s.range[1]);
const qCountAnswered=()=>Object.keys(state.answers).length+Object.values(state.writing).filter(v=>v&&v.trim()).length;
function formatTime(x){x=Math.max(0,x);return `${String(Math.floor(x/3600)).padStart(2,'0')}:${String(Math.floor((x%3600)/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`}
function renderTabs(){const sec=sectionFor(state.current);$('#sectionTabs').innerHTML=D.sections.map(s=>`<button class="section-tab ${sec.id===s.id?'active':''}" data-sec="${s.id}">${s.label}${s.id==='speaking'?' · 练习':''}</button>`).join('');document.querySelectorAll('.section-tab').forEach(b=>b.onclick=()=>{const s=D.sections.find(x=>x.id===b.dataset.sec);state.current=s.range[0];render();});}
function renderGrid(){const sec=sectionFor(state.current);let ids=[];for(let i=sec.range[0];i<=sec.range[1];i++) ids.push(i);$('#questionGrid').innerHTML=ids.map(id=>{const answered=id<=70?!!state.answers[id]:id<=72?!!(state.writing[id]||'').trim():!!state.recordings[id];return `<button class="qbtn ${answered?'answered':''} ${id===state.current?'current':''} ${state.flags[id]?'flagged':''}" data-id="${id}">${id<=72?id:id-72}</button>`}).join('');document.querySelectorAll('.qbtn').forEach(b=>b.onclick=()=>{state.current=+b.dataset.id;render();});$('#progressText').textContent=`${qCountAnswered()} / 72 已答`}
function renderAudio(q){const a=$('#audioArea');if(!q.audioText){a.classList.add('hidden');a.innerHTML='';return}a.classList.remove('hidden');const disabled=state.strict&&state.played[q.id];a.innerHTML=`<button class="audio-play" ${disabled?'disabled':''}>▶ ${disabled?'已播放':'播放听力'}</button><span class="audio-note">${state.strict?'严格模式：每题仅一次':'练习模式：可重复播放'} · 不显示原文</span>`;a.querySelector('button').onclick=()=>playText(q)}
function playText(q){if(state.strict&&state.played[q.id])return;if(!('speechSynthesis'in window)){alert('此浏览器不支持语音播放。请使用 Chrome/Edge，或换成真人 MP3。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.audioText);u.lang='zh-CN';u.rate=.96;u.pitch=1.0;const voices=speechSynthesis.getVoices();const zh=voices.find(v=>/zh|Chinese|Mandarin/i.test(v.lang+' '+v.name));if(zh)u.voice=zh;speechSynthesis.speak(u);state.played[q.id]=true;save();renderAudio(q)}
function renderMCQ(q){$('#questionBody').textContent=q.prompt;$('#options').innerHTML=Object.entries(q.options).map(([k,v])=>`<div class="option ${state.answers[q.id]===k?'selected':''}" data-k="${k}"><span class="option-letter">${k}</span><span>${v}</span></div>`).join('');document.querySelectorAll('.option').forEach(o=>o.onclick=()=>{state.answers[q.id]=o.dataset.k;save();render();});}
function renderWriting(q){const w=$('#writingArea');w.classList.remove('hidden');const val=state.writing[q.id]||'';w.innerHTML=`<textarea class="writing-box" placeholder="请在这里输入作文……"></textarea><div class="counter"><span id="charCount">${countChars(val)}</span> / 最少 ${q.minChars} 字</div>`;const ta=w.querySelector('textarea');ta.value=val;ta.oninput=()=>{state.writing[q.id]=ta.value;$('#charCount').textContent=countChars(ta.value);save();renderGrid();};}
function countChars(t){return (t.match(/[\u3400-\u9fffA-Za-z0-9]/g)||[]).length}
function renderSpeaking(q){const s=$('#speakingArea');s.classList.remove('hidden');const rec=state.recordings[q.id];s.innerHTML=`<div class="speaking-card"><p>点击录音后开始作答。录音只保存在当前页面内，建议完成后立即下载。</p><div class="record-controls"><button class="record-btn" id="recordBtn">● 开始录音</button><span class="record-time" id="recordTime">00:00</span></div>${rec?`<a class="download-link" id="recordDownload" href="${rec.url}" download="HSK5_Speaking_Q${q.id-72}.webm">下载本题录音</a>`:''}</div>`;$('#recordBtn').onclick=()=>toggleRecord(q.id)}
async function toggleRecord(id){const btn=$('#recordBtn');if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();btn.textContent='● 开始录音';btn.classList.remove('stop');clearInterval(recordTimer);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);recordSeconds=0;mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=()=>{const blob=new Blob(chunks,{type:'audio/webm'});const url=URL.createObjectURL(blob);state.recordings[id]={blob,url};stream.getTracks().forEach(t=>t.stop());render();};mediaRecorder.start();btn.textContent='■ 停止录音';btn.classList.add('stop');recordTimer=setInterval(()=>{recordSeconds++;const el=$('#recordTime');if(el)el.textContent=`${String(Math.floor(recordSeconds/60)).padStart(2,'0')}:${String(recordSeconds%60).padStart(2,'0')}`},1000);}catch(e){alert('无法使用麦克风。请允许浏览器麦克风权限，并使用 HTTPS/GitHub Pages。')}}
function render(){const q=qById(state.current),sec=sectionFor(state.current);renderTabs();renderGrid();$('#partLabel').textContent=q.part;$('#questionTitle').textContent=q.type==='speaking'?q.prompt:`第 ${q.id} 题`;$('#passage').classList.toggle('hidden',!q.passage);$('#passage').textContent=q.passage||'';$('#questionBody').textContent='';$('#options').innerHTML='';$('#writingArea').classList.add('hidden');$('#writingArea').innerHTML='';$('#speakingArea').classList.add('hidden');$('#speakingArea').innerHTML='';renderAudio(q);if(q.type==='mcq')renderMCQ(q);if(q.type==='writing'){$('#questionBody').textContent=q.prompt;renderWriting(q)}if(q.type==='speaking')renderSpeaking(q);$('#flagBtn').classList.toggle('active',!!state.flags[q.id]);$('#flagBtn').textContent=state.flags[q.id]?'★ 已标记':'☆ 标记';$('#prevBtn').disabled=q.id===1;$('#nextBtn').disabled=q.id===77;$('#navStatus').textContent=`${sec.label} · ${q.id-sec.range[0]+1} / ${sec.range[1]-sec.range[0]+1}`;document.documentElement.style.setProperty('--font',state.font+'px');}
function start(){state.strict=$('#strictMode').checked;state.started=true;$('#startOverlay').classList.remove('show');clearInterval(tick);tick=setInterval(()=>{state.seconds--;$('#timer').textContent=formatTime(state.seconds);if(state.seconds%5===0)save();if(state.seconds<=0){clearInterval(tick);showResult(true)}},1000);render();}
function showResult(auto=false){const total=70;let correct=0;for(let i=1;i<=70;i++)if(state.answers[i]===D.answerKey[i])correct++;let l=0,r=0;for(let i=1;i<=35;i++)if(state.answers[i]===D.answerKey[i])l++;for(let i=36;i<=70;i++)if(state.answers[i]===D.answerKey[i])r++;const blanks=[];for(let i=1;i<=70;i++)if(!state.answers[i])blanks.push(i);$('#resultContent').innerHTML=`${auto?'<p><strong>时间到，系统已自动交卷。</strong></p>':''}<div class="result-grid"><div class="score-card"><strong>${correct}/${total}</strong><span>客观题</span></div><div class="score-card"><strong>${l}/35</strong><span>听力</span></div><div class="score-card"><strong>${r}/35</strong><span>阅读</span></div></div><p>未答客观题：${blanks.length?blanks.join('、'):'无'}</p><p>写作：第71题 ${countChars(state.writing[71]||'')} 字；第72题 ${countChars(state.writing[72]||'')} 字。</p><p style="color:#6d7885">写作和口语不自动评分。可把作文与录音交给老师/ChatGPT按评分维度批改。</p>`;$('#resultOverlay').classList.add('show')}
function downloadResult(){const data={exam:'HSK5 3.0 模拟考试 02 · 词汇强化版',date:new Date().toISOString(),objectiveAnswers:state.answers,writing:state.writing,remainingSeconds:state.seconds};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='HSK5_3.0_Mock02_Result.json';a.click();URL.revokeObjectURL(a.href)}
$('#startBtn').onclick=start;$('#submitBtn').onclick=()=>{if(confirm('确定交卷吗？仍可返回检查。'))showResult(false)};$('#closeResult').onclick=()=>$('#resultOverlay').classList.remove('show');$('#downloadResult').onclick=downloadResult;$('#prevBtn').onclick=()=>{if(state.current>1){state.current--;render()}};$('#nextBtn').onclick=()=>{if(state.current<77){state.current++;render()}};$('#flagBtn').onclick=()=>{state.flags[state.current]=!state.flags[state.current];save();render()};$('#fontUp').onclick=()=>{state.font=Math.min(24,state.font+1);save();render()};$('#fontDown').onclick=()=>{state.font=Math.max(15,state.font-1);save();render()};$('#resetBtn').onclick=()=>{if(confirm('清除全部选择、作文和计时进度？')){localStorage.removeItem('hsk5_mock02_state');location.reload()}};
$('#timer').textContent=formatTime(state.seconds);render();
})();

</script>
